// % exacto sin redondear (2 decimales, formato es-AR, sin ceros de más).
const pctTxt = n => (n == null) ? '—' : (+Number(n).toFixed(2)).toLocaleString('es-AR') + '%';

// Control: muestra el panorama de TODAS las publicaciones en promo con su descuento
// real (general y Meli+, exacto) y marca las que SUPERAN el tope Meli+ costeado por
// tamaño. Distingue DEAL (vos elegís) de SMART/oferta compartida (ML gestiona).
// Combos: dos familias — combo-gel (30/35) y combo-crema (35/40).
function renderControlDescuentos() {
  // v2 (nov-2026): lee v_ml_promo_control = el precio que ve HOY el comprador (la promo activa más barata),
  // cuánto pone Rosaint (en ofertas compartidas solo su parte; lo demás lo pone ML), el tope y el margen
  // neto real (costos con mano de obra del Core + cargos ML + IIBB y publicidad medidos en Vendra).
  const cont = $('#promo-control');
  if (!cont) return;
  const minMg = PAUTO_PAR.promos_margen_min_pct ?? 20;
  const filasData = (CTRL_ROWS || []).map(r => {
    const exc = r.exceso == null ? null : Number(r.exceso);
    const mg = r.margen_general?.margen_pct != null ? Number(r.margen_general.margen_pct) : null;
    const mgMeli = r.margen_meli?.margen_pct != null ? Number(r.margen_meli.margen_pct) : null;
    const peorMg = [mg, mgMeli].filter(x => x != null).reduce((a, b) => Math.min(a, b), Infinity);
    let est;
    if (r.tope == null) est = { k: 'sin', txt: 'Sin regla', tip: 'No se reconoce el tamaño en el título' };
    else if (exc > 0.1 && r.excepcion_aprobada) est = { k: 'exc', txt: 'Excepción aprobada', tip: `Se pasa ${fmtPts(exc)} del tope, aprobado a mano` };
    else if (exc > 0.1) est = { k: 'mal', txt: 'Supera el tope', tip: `Se pasa ${fmtPts(exc)} del tope` };
    else if (peorMg < minMg) est = { k: 'baja', txt: 'Margen bajo', tip: `Respeta el tope, pero el margen queda por debajo del ${minMg}%` };
    else est = { k: 'ok', txt: 'OK', tip: exc > 0 ? `ML movió unos centavos el precio (+${fmtPts(exc)}): no cuenta` : 'Dentro del tope' };
    return { r, exc, mg, mgMeli, est };
  });
  const orden = { mal: 0, baja: 1, exc: 2, sin: 3, ok: 4 };
  filasData.sort((a, b) => (orden[a.est.k] - orden[b.est.k]) || ((a.mg ?? 99) - (b.mg ?? 99)));
  const n = k => filasData.filter(x => x.est.k === k).length;
  const mal = n('mal'), baja = n('baja'), exc = n('exc'), ok = n('ok');

  const mgCelda = (m, cad) => {
    if (!m || m.margen_pct == null) return '<span class="pct-ok">—</span>';
    const v = Number(m.margen_pct), cls = v < minMg ? 'mg-mal' : v < minMg + 5 ? 'mg-justo' : 'mg-bien';
    const tip = `Ingreso neto $${fmtN(m.neto)} − cargos ML $${fmtN(m.cargos_ml)} − IIBB $${fmtN(m.iibb)} − costo $${fmtN(m.costo)} = ganancia $${fmtN(m.ganancia)}`
      + (m.acos != null ? `\nSi la venta entra por publicidad (ACOS del mes ${String(m.acos).replace('.', ',')}%): ganancia $${fmtN(m.ganancia_con_ads)}` : '');
    return `<span class="${cls}" title="${esc(tip)}">${pctTxt(v)}</span>${cad ? `<span class="sub">${cad}</span>` : ''}`
      + (m.acos != null ? `<span class="sub" title="${esc(tip)}">con publicidad ${pctTxt(m.margen_con_ads_pct)}</span>` : '');
  };

  const filas = filasData.map(({ r, est }) => {
    const esSmart = r.tipo === 'SMART';
    const meliAparte = r.precio_meli != null && Number(r.precio_meli) < Number(r.precio_hoy);
    const promoTxt = r.promo ? `${esc(r.promo)}${r.finish_date ? ' · hasta ' + fFecha(r.finish_date) : ''}` : 'sin promo';
    const prox = r.precio_prox != null && r.promo_prox && r.inicio_prox
      ? `<span class="sub">desde ${fFecha(r.inicio_prox)}: ${esc(r.promo_prox)} ${fmtARS(Number(r.precio_prox))}</span>` : '';
    return `
    <tr>
      <td>${esc(cleanTitle(r.titulo))}<span class="sub">${esc(r.etiqueta || '')} · lista ${fmtARS(Number(r.lista))}</span></td>
      <td class="num"><b>${fmtARS(Number(r.precio_hoy))}</b>${meliAparte ? `<span class="sub">Meli+ ${fmtARS(Number(r.precio_meli))}</span>` : ''}<span class="sub">${promoTxt}${esSmart ? ' <span class="badge cuotas" title="Oferta compartida: ML pone una parte del descuento">compartida</span>' : ''}</span>${prox}</td>
      <td class="num">${pctTxt(r.pone_general)}${esSmart ? `<span class="sub">ML pone ${pctTxt(100 * (1 - Number(r.precio_hoy) / Number(r.lista)) - Number(r.pone_general))}</span>` : ''}${meliAparte ? `<span class="sub">Meli+ ${pctTxt(r.pone_meli)}</span>` : ''}</td>
      <td class="num pct-ok">${r.tope != null ? pctTxt(r.tope) : '—'}</td>
      <td class="num">${mgCelda(r.margen_general, meliAparte ? 'precio general' : '')}${meliAparte && r.margen_meli ? `<div style="margin-top:4px;">${mgCelda(r.margen_meli, 'comprador Meli+')}</div>` : ''}</td>
      <td><span class="est est-${est.k}" title="${esc(est.tip)}">${est.txt}</span></td>
    </tr>`;
  }).join('');

  const clase = mal ? 'bad' : (baja ? 'warn' : 'good');
  const titulo = mal
    ? `⚠ ${mal} publicación${mal !== 1 ? 'es' : ''} supera${mal !== 1 ? 'n' : ''} el tope sin aprobación`
    : baja ? `${baja} publicación${baja !== 1 ? 'es' : ''} con margen bajo` : '✓ Todo dentro de los topes';
  const resumen = [`${ok} OK`, exc ? `${exc} excepción${exc !== 1 ? 'es' : ''} aprobada${exc !== 1 ? 's' : ''}` : '', baja ? `${baja} con margen bajo` : '', mal ? `${mal} para revisar` : '']
    .filter(Boolean).join(' · ');

  cont.innerHTML = `
    <div class="control-card ${clase}">
      <div style="display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;">
        <h4 style="margin:0;">${titulo}</h4>
        <span style="font-size:12.5px; color:var(--muted);">${resumen}</span>
      </div>
      <div style="font-size:12.5px; color:var(--muted); margin-top:4px;">Precio que ve <b>hoy</b> el comprador (la promoción activa más barata) y cuánto descuento ponés vos. En las ofertas compartidas cuenta solo tu parte: el resto lo pone Mercado Libre. Margen neto sin IVA, después de cargos de ML, Ingresos Brutos y costo con mano de obra.</div>
      <table class="control-tabla">
        <thead><tr><th>Producto</th><th class="num">Precio hoy</th><th class="num">Ponés vos</th><th class="num">Tope</th><th class="num">Margen neto</th><th>Estado</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
      <div class="control-note">Pasá el mouse sobre el margen para ver la cuenta. "Con publicidad" = una venta que entra por el anuncio, con el ACOS del mes (Vendra). Desvíos de unos centavos que hace ML al redondear no cuentan como exceso.</div>
    </div>`;
}
const fmtN = n => n == null ? '—' : Math.round(Number(n)).toLocaleString('es-AR');
const fmtPts = n => (+Number(n).toFixed(2)).toLocaleString('es-AR') + ' pts';


function renderPromos() {
  const fechas = PROMOS.map(p => p.sincronizado_en).filter(Boolean).sort();
  $('#promo-sync-info').textContent = fechas.length
    ? `${PROMOS.length} promociones · sincronizado ${fFecha(fechas[fechas.length-1])} ${new Date(fechas[fechas.length-1]).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`
    : `${PROMOS.length} promociones`;

  if (!PROMOS.length) {
    $('#promo-alert').innerHTML = '';
    $('#promo-content').innerHTML = '<div class="empty-box">No hay promociones cargadas. Tocá "Sincronizar promociones".</div>';
    return;
  }

  const activas = PROMOS.filter(p => p.estado === 'started')
    .sort((a,b) => new Date(a.finish_date||0) - new Date(b.finish_date||0));
  const proximas = PROMOS.filter(p => p.estado !== 'started')
    .sort((a,b) => new Date(a.start_date||0) - new Date(b.start_date||0));

  const porTerminar = activas.filter(p => { const d = diasHasta(p.finish_date); return d != null && d <= 3; });
  $('#promo-alert').innerHTML = porTerminar.length ? `
    <div class="alerta-promo">
      <b>⚠ ${porTerminar.length} promoción${porTerminar.length>1?'es':''} termina${porTerminar.length>1?'n':''} en ≤3 días</b>
      <div>${porTerminar.map(p => esc(p.nombre || p.id)).join(' · ')} — revisá si querés renovarlas o reacomodar precios antes de que caigan.</div>
    </div>` : '';

  let html = `<div class="divisor-inactivas" style="margin-top:2px;">Activas · ${activas.length}</div>`;
  html += activas.length ? activas.map(renderPromoCard).join('') : '<div class="empty-box">Ninguna activa.</div>';
  if (proximas.length) {
    html += `<div class="divisor-inactivas">Próximas · ${proximas.length}</div>`;
    html += proximas.map(renderPromoCard).join('');
  }
  $('#promo-content').innerHTML = html;
}

function renderPromoCard(p) {
  const items = PROMO_ITEMS.filter(x => x.promo_id === p.id && x.estado_en_promo !== 'candidate');
  const ofrecidos = PROMO_ITEMS.filter(x => x.promo_id === p.id && x.estado_en_promo === 'candidate').length;
  const esProxima = p.estado !== 'started';
  const dias = diasHasta(esProxima ? p.start_date : p.finish_date);
  let finTxt;
  if (esProxima) {
    finTxt = `Arranca ${fFecha(p.start_date)}${dias!=null ? ` · en ${dias} día${dias!==1?'s':''}` : ''}`;
  } else {
    const cuando = dias == null ? '' : (dias <= 0 ? ' · termina hoy' : ` · en ${dias} día${dias!==1?'s':''}`);
    finTxt = `Termina ${fFecha(p.finish_date)}${cuando}`;
  }
  const finCls = esProxima ? 'muted' : claseFin(dias);
  const tipoBadge = p.tipo === 'SMART'
    ? '<span class="badge cuotas" title="Promoción inteligente gestionada por ML (ML pone parte del descuento)">SMART</span>'
    : '<span class="badge cat" title="Oferta/campaña donde elegís entrar por producto">DEAL</span>';

  const filas = items
    .slice().sort((a,b) => Number(a.price||0) - Number(b.price||0))
    .map(it => `
      <tr>
        <td>${esc(cleanTitle(it.titulo || it.item_id))}${!it.activa ? ' <span class="badge inactiva">pausada</span>' : ''}</td>
        <td class="num" style="color:var(--muted); text-decoration:line-through;">${it.original_price!=null?fmtARS(Number(it.original_price)):'—'}</td>
        <td class="num" style="color:var(--accent); font-weight:600;">${it.price!=null?fmtARS(Number(it.price)):'—'}</td>
      </tr>`).join('');

  return `
    <details class="promo-card">
      <summary>
        <span class="promo-nombre">${esc(p.nombre || p.id)} ${tipoBadge}</span>
        <span class="promo-fin ${finCls}">${finTxt}</span>
        <span class="promo-cnt">${items.length} prod.${ofrecidos ? ` · <span style="color:var(--muted)" title="ML los ofrece y no entramos">${ofrecidos} sin entrar</span>` : ''}</span>
      </summary>
      <div class="promo-body">
        ${items.length
          ? `<table class="promo-tabla"><thead><tr><th>Producto</th><th class="num">Lista</th><th class="num">En promo</th></tr></thead><tbody>${filas}</tbody></table>`
          : '<div style="padding:10px 14px; color:var(--muted); font-size:12.5px;">Sin productos listados.</div>'}
      </div>
    </details>`;
}

let AUTO_PROMOS_HECHO = false;

// ─────── PROMOS AUTOMÁTICAS (nov-2026) ───────
// ml-promos-sync {accion:'barrer'} corre cada 3 h (cron ml-promos-barrer): entra solo a las campañas que
// respetan el tope de descuento (ml_reglas_descuento.desc_meli_pct) Y dejan el margen mínimo
// (promos_margen_min_pct); lo que se pasa hasta promos_tolerancia_pts, o queda con margen bajo, se lista
// acá para aprobar o rechazar y avisa por mail. Margen = ml_margen() (vista v_ml_promos_auto).
let PAUTO = [], PAUTO_PAR = {};
async function cargarPromosAuto() {
  const cont = $('#promo-auto'); if (!cont) return;
  const [a, p] = await Promise.all([
    sb.from('v_ml_promos_auto').select('*').order('actualizado_en', { ascending: false }).limit(300),
    sb.from('ml_parametros').select('clave,valor').in('clave', ['promos_auto', 'promos_tolerancia_pts', 'promos_margen_min_pct']),
  ]);
  if (a.error) { cont.innerHTML = `<div class="empty-box" style="color:var(--hot);">Promos automáticas: ${esc(a.error.message)}</div>`; return; }
  PAUTO = a.data || []; PAUTO_PAR = {}; (p.data || []).forEach(x => PAUTO_PAR[x.clave] = Number(x.valor));
  renderPromosAuto();
  renderControlDescuentos(); // usa el margen mínimo
}
function renderPromosAuto() {
  const cont = $('#promo-auto');
  const on = PAUTO_PAR.promos_auto === 1, tol = PAUTO_PAR.promos_tolerancia_pts ?? 3, minMg = PAUTO_PAR.promos_margen_min_pct ?? 20;
  const hoy = Date.now();
  const vigente = x => !x.promo_fin || new Date(x.promo_fin).getTime() > hoy;
  const decidir = PAUTO.filter(x => x.estado === 'a_decidir' && vigente(x));
  const aplicadas = PAUTO.filter(x => x.estado === 'aplicada' && vigente(x));
  const fuera = PAUTO.filter(x => x.estado === 'fuera_de_tope' && vigente(x));
  const errores = PAUTO.filter(x => x.estado === 'error' && vigente(x));
  const precio = x => x.precio_general != null ? fmtARS(Number(x.precio_general)) : '—';
  const cuanto = x => x.tipo === 'SMART' ? `${pctTxt(x.seller_pct)}<span class="sub">ML pone el resto</span>` : (x.desc_pct != null ? pctTxt(x.desc_pct) : '—');
  const exc = x => x.exceso_pts == null ? '—' : Number(x.exceso_pts) > 0.05 ? `<span class="pct-off">+${fmtPts(x.exceso_pts)}</span>` : '<span class="pct-ok">dentro</span>';
  const mg = x => {
    const m = x.margen; if (!m || m.margen_pct == null) return '<span class="pct-ok">—</span>';
    const v = Number(m.margen_pct), cls = v < minMg ? 'mg-mal' : v < minMg + 5 ? 'mg-justo' : 'mg-bien';
    const tip = `Ingreso neto $${fmtN(m.neto)} − cargos ML $${fmtN(m.cargos_ml)} − IIBB $${fmtN(m.iibb)} − costo $${fmtN(m.costo)} = ganancia $${fmtN(m.ganancia)}`;
    return `<span class="${cls}" title="${esc(tip)}">${pctTxt(v)}</span><span class="sub">$${fmtN(m.ganancia)} por venta</span>`;
  };
  const fila = (x, botones) => `<tr>
      <td>${esc(cleanTitle(x.titulo || x.item_id))}<span class="sub">${esc(x.promo_nombre || x.promo_id)}${x.promo_fin ? ' · hasta ' + fFecha(x.promo_fin) : ''}</span></td>
      <td class="num">${precio(x)}</td>
      <td class="num">${cuanto(x)}</td>
      <td class="num pct-ok">${x.tope_pct != null ? pctTxt(x.tope_pct) : '—'}</td>
      <td class="num">${exc(x)}</td>
      <td class="num">${mg(x)}</td>
      <td style="white-space:nowrap;">${botones ? `<button class="btn primary sm" data-pa="aprobar" data-id="${x.id}">Aprobar</button> <button class="btn secondary sm" data-pa="rechazar" data-id="${x.id}">Rechazar</button>` : `<span class="sub" style="margin:0;">${esc(x.detalle || '')}</span>`}</td>
    </tr>`;
  const tabla = (xs, b) => `<table class="control-tabla"><thead><tr><th>Producto · campaña</th><th class="num">Precio</th><th class="num">Ponés vos</th><th class="num">Tope</th><th class="num">Exceso</th><th class="num">Margen neto</th><th></th></tr></thead><tbody>${xs.map(x => fila(x, b)).join('')}</tbody></table>`;
  cont.innerHTML = `
    <div class="control-card">
      <div style="display:flex; gap:10px 18px; align-items:center; flex-wrap:wrap;">
        <h4 style="margin:0;">Promos automáticas</h4>
        <label class="pa-opt"><input type="checkbox" id="pa-on" ${on ? 'checked' : ''}> Entrar solas si respetan tope y margen</label>
        <label class="pa-opt">Margen mínimo <input type="number" class="input pa-num" id="pa-min" min="0" max="80" step="1" value="${minMg}"> %</label>
        <label class="pa-opt">Avisarme si se pasan hasta <input type="number" class="input pa-num" id="pa-tol" min="0" max="15" step="0.5" value="${tol}"> pts</label>
        <span style="flex:1;"></span>
        <button class="btn secondary" id="pa-barrer">Revisar ahora</button>
      </div>
      <div style="font-size:12.5px; color:var(--muted); margin-top:4px;">Cada 3 horas revisa las campañas que ofrece Mercado Libre. Entra sola a las que respetan el tope del tamaño y dejan al menos el margen mínimo; las demás te las deja acá (y por mail) para que decidas con los números.</div>
      ${decidir.length ? `<div class="divisor-inactivas">Para decidir · ${decidir.length}</div>${tabla(decidir, true)}` : '<div style="margin-top:10px; font-size:13px; color:var(--muted);">Nada para decidir.</div>'}
      ${errores.length ? `<div class="divisor-inactivas">Con error · ${errores.length}</div>${tabla(errores, true)}` : ''}
      ${aplicadas.length ? `<details style="margin-top:10px;"><summary style="cursor:pointer; font-size:13px;">Aplicadas y vigentes · ${aplicadas.length}</summary>${tabla(aplicadas, false)}</details>` : ''}
      ${fuera.length ? `<details style="margin-top:6px;"><summary style="cursor:pointer; font-size:13px;">Ignoradas por pasarse mucho del tope · ${fuera.length}</summary>${tabla(fuera, true)}</details>` : ''}
    </div>`;
  $('#pa-on').addEventListener('change', e => guardarParPromos('promos_auto', e.target.checked ? 1 : 0));
  $('#pa-tol').addEventListener('change', e => guardarParPromos('promos_tolerancia_pts', Number(e.target.value)));
  $('#pa-min').addEventListener('change', e => guardarParPromos('promos_margen_min_pct', Number(e.target.value)));
  $('#pa-barrer').addEventListener('click', barrerPromosAhora);
  cont.querySelectorAll('[data-pa]').forEach(b => b.addEventListener('click', () => decidirPromo(b.dataset.pa, Number(b.dataset.id), b)));
}
async function guardarParPromos(clave, valor) {
  const { error } = await sb.from('ml_parametros').update({ valor }).eq('clave', clave);
  if (error) return toast('Error: ' + error.message, 'err');
  PAUTO_PAR[clave] = valor; toast('✓ Guardado', 'ok');
  if (clave === 'promos_margen_min_pct') { renderPromosAuto(); renderControlDescuentos(); }
}
async function barrerPromosAhora() {
  const b = $('#pa-barrer'); b.disabled = true; b.textContent = 'Revisando…';
  try {
    const { data, error } = await sb.functions.invoke('ml-promos-sync', { body: { accion: 'barrer' } });
    if (error) throw new Error(error.message);
    if (data && data.ok === false) throw new Error(data.error || 'Error');
    toast(`✓ ${data.aplicadas} aplicadas · ${data.a_decidir} para decidir · ${data.fuera_de_tope} fuera de tope`, 'ok');
    await cargarPromociones();
  } catch (err) { toast('Error: ' + err.message, 'err'); b.disabled = false; b.textContent = 'Revisar ahora'; }
}
async function decidirPromo(accion, id, btn) {
  btn.disabled = true; btn.textContent = accion === 'aprobar' ? 'Aplicando…' : 'Guardando…';
  try {
    const { data, error } = await sb.functions.invoke('ml-promos-sync', { body: { accion, id } });
    if (error) throw new Error(error.message);
    if (data && data.ok === false) throw new Error(data.error || 'Error');
    toast(accion === 'aprobar' ? '✓ Entró a la promoción' : '✓ Rechazada: no se vuelve a proponer', 'ok');
    await cargarPromociones();
  } catch (err) { toast('Error: ' + err.message, 'err'); btn.disabled = false; btn.textContent = accion === 'aprobar' ? 'Aprobar' : 'Rechazar'; }
}

async function sincronizarPromos(auto) {
  const btn = $('#btnSyncPromos'); const prev = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sincronizando…';
  try {
    const { data, error } = await sb.functions.invoke('ml-promos-sync', { body: {} });
    if (error) throw new Error(error.message);
    if (data && data.ok === false) throw new Error(data.error || 'Error');
    if (auto !== true) toast(`✓ ${data.promos} promociones · ${data.items} productos`, 'ok');
    await cargarPromociones();
  } catch (err) {
    toast('Error: ' + err.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = prev;
  }
}

function actualizarSyncInfo(count) {
  const fechas = PUBS.map(p => p.sincronizado_en).filter(Boolean).sort();
  const c = count != null ? count : PUBS.length;
  let sincTxt = '';
  if (fechas.length) {
    const ultima = new Date(fechas[fechas.length - 1]);
    sincTxt = ` · sincronizado ${ultima.toLocaleDateString('es-AR')} ${ultima.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}`;
  } else {
    sincTxt = ' · sin sincronizar';
  }
  $('#sync-info').textContent = `${c} publicaciones${sincTxt}`;
}

function renderPubs() {
  const q = $('#pub-search').value.trim().toLowerCase();
  const fT = $('#pub-tipo').value, fC = $('#pub-cuotas').value, fA = $('#pub-act').value;

  let rows = PUBS.filter(p => {
    if (q) {
      const txt = `${p.item_id} ${p.codigo_sku || ''} ${p.codigo_combo || ''} ${p.titulo || ''}`.toLowerCase();
      if (!txt.includes(q)) return false;
    }
    if (fT && p.tipo_publicacion !== fT) return false;
    if (fC === 'con' && !p.con_cuotas) return false;
    if (fC === 'sin' && p.con_cuotas) return false;
    if (fA === 'activa' && !p.activa) return false;
    if (fA === 'pausada' && (p.activa || esFinalizada(p))) return false;
    if (fA === 'finalizada' && !esFinalizada(p)) return false;
    return true;
  });

  actualizarSyncInfo(rows.length);
  $('#panel-ads-ml').innerHTML = renderPanelAdsML(rows);

  if (!rows.length) { $('#pub-content').innerHTML = '<div class="empty-box">Sin publicaciones con esos filtros.</div>'; return; }

  // Activas arriba; pausadas y finalizadas en sus propias secciones abajo — sin mezclar.
  const activas = rows.filter(p => p.activa);
  const pausadas = rows.filter(p => !p.activa && !esFinalizada(p));
  const finalizadas = rows.filter(p => !p.activa && esFinalizada(p));

  let html = agruparPubs(activas).map(g => renderGrupoML(g)).join('');
  if (pausadas.length) {
    html += `<div class="divisor-inactivas">Pausadas · ${pausadas.length}</div>`;
    html += agruparPubs(pausadas).map(g => renderGrupoML(g)).join('');
  }
  if (finalizadas.length) {
    if (fA === 'finalizada') {
      // Filtro explícito "Solo finalizadas": se muestran siempre, sin toggle.
      html += `<div class="divisor-inactivas">Finalizadas · ${finalizadas.length}</div>`;
      html += agruparPubs(finalizadas).map(g => renderGrupoML(g)).join('');
    } else {
      html += `<div class="divisor-inactivas divisor-toggle" id="toggle-finalizadas">Finalizadas · ${finalizadas.length} `
        + `<span class="toggle-link">${mostrarFinalizadas ? '(ocultar)' : '(mostrar)'}</span></div>`;
      if (mostrarFinalizadas) html += agruparPubs(finalizadas).map(g => renderGrupoML(g)).join('');
    }
  }
  $('#pub-content').innerHTML = html;
  const tf = document.getElementById('toggle-finalizadas');
  if (tf) tf.addEventListener('click', () => { mostrarFinalizadas = !mostrarFinalizadas; renderPubs(); });
}

// Agrupa publicaciones por product_number (variantes juntas), ordenadas por SKU.
function agruparPubs(rows) {
  const grupos = {};
  for (const p of rows) {
    const k = p.product_number || p.item_id;
    if (!grupos[k]) grupos[k] = { titulo: p.titulo, sku: p.codigo_sku, rows: [] };
    grupos[k].rows.push(p);
  }
  return Object.values(grupos).sort((a,b) => (a.sku || 'zz').localeCompare(b.sku || 'zz'));
}

// Panel superior: alertas accionables sobre publicidad + ADS.
// Categoriza los productos: plata tirada / optimizar / variantes desbalanceadas / candidatos a pautar.
let VENDRA_PUB = {};
function renderPanelAdsML(pubs) {
  const conAds = pubs.filter(p => parseFloat(p.ads_total || 0) > 0);
  if (conAds.length === 0) return '';

  // Total de publicidad: el de Vendra (Product Ads + Display, al centavo con ML) si llegó; si no,
  // la suma por anuncio de Product Ads, que no incluye Display.
  const vMes = VENDRA_PUB.mes, vSem = VENDRA_PUB['7d'];
  const gastoTotal = vMes && vMes.publicidad != null ? Number(vMes.publicidad) : conAds.reduce((a,p) => a + parseFloat(p.ads_total || 0), 0);
  const gasto7d = vSem && vSem.publicidad != null ? Number(vSem.publicidad) : pubs.reduce((a,p) => a + parseFloat(p.ads_7d || 0), 0);
  const tipVendra = vMes && vMes.publicidad != null
    ? `Fuente Vendra (sin IVA). Mes: Product Ads ${fmtARS(vMes.product_ads)} + Display ${fmtARS(vMes.display)}. 7 días: ${vSem ? fmtARS(vSem.product_ads) + ' + ' + fmtARS(vSem.display) : '—'}. Actualizado ${new Date(vMes.traido_en).toLocaleString('es-AR')}${vMes.error ? ' · último intento con error: ' + vMes.error : ''}`
    : 'Solo Product Ads (sin Display): el resumen de Vendra todavía no llegó';
  const limpio = (t) => esc((t || '').replace(/ - Rosaint.*$/i,'').replace(/Rosaint®?\s*Profesional/i,'').trim());

  const v7 = (p) => Number(p.ventas_7d || 0);
  const vTot = (p) => Number(p.ventas_total || 0);
  const rent = (p) => parseFloat(p.rentabilidad_con_ads_pct);

  // Agrupar por producto (ML pauta a nivel producto, no variante)
  const prod = {};
  for (const p of pubs) {
    const k = p.product_number || p.item_id;
    if (!prod[k]) prod[k] = { titulo: p.titulo, vars: [] };
    prod[k].vars.push(p);
  }
  const productos = Object.values(prod).map(g => {
    const gastoProd = g.vars.reduce((a,p) => a + parseFloat(p.ads_total||0), 0);
    const gasto7Prod = g.vars.reduce((a,p) => a + parseFloat(p.ads_7d||0), 0);
    const ventasProd = g.vars.reduce((a,p) => a + vTot(p), 0);
    const ventas7Prod = g.vars.reduce((a,p) => a + v7(p), 0);
    const visitas7Prod = g.vars.reduce((a,p) => a + Number(p.visitas_7d||0), 0);
    const conVentas = g.vars.filter(p => vTot(p) > 0 && p.rentabilidad_con_ads_pct != null);
    let rentProd = null;
    if (conVentas.length) {
      const tot = conVentas.reduce((a,p)=>a+vTot(p),0);
      rentProd = conVentas.reduce((a,p)=>a + rent(p)*vTot(p),0) / tot;
    } else {
      const r = g.vars.filter(p => p.rentabilidad_con_ads_pct != null).map(rent);
      rentProd = r.length ? r.reduce((a,b)=>a+b,0)/r.length : null;
    }
    const rsa = g.vars.filter(p => p.rentabilidad_pct != null).map(p => parseFloat(p.rentabilidad_pct));
    const rentSinAds = rsa.length ? rsa.reduce((a,b)=>a+b,0)/rsa.length : null;
    // pauta_activa = el anuncio está activo Y su campaña activa (si está pausado, no gasta: no recomendar pausarlo).
    const esBool = (v) => v === true || v === 'true';
    const pautaActiva = g.vars.some(p => esBool(p.pauta_activa));
    // Gastó y no vendió NADA por pauta: ML reporta ACOS 0% (parece bárbaro y es lo peor).
    const sinVentasActiva = g.vars.some(p => esBool(p.pauta_activa) && esBool(p.pauta_sin_ventas));
    return { ...g, gastoProd, gasto7Prod, ventasProd, ventas7Prod, visitas7Prod, rentProd, rentSinAds, pautaActiva, sinVentasActiva };
  });

  // Solo se recomienda accionar sobre pauta ACTIVA (lo pausado ya no gasta).
  const plataTirada = productos.filter(g => g.pautaActiva && g.gastoProd > 0 && (
        g.sinVentasActiva ||
        (g.rentProd != null && g.rentProd < 0) ||
        (g.rentProd != null && g.rentProd < 15 && g.ventas7Prod <= 1 && g.ventasProd <= 10)
     ))
    .sort((a,b) => (a.sinVentasActiva?-999:(a.rentProd??999)) - (b.sinVentasActiva?-999:(b.rentProd??999)));
  const optimizar = productos.filter(g => g.pautaActiva && g.gastoProd > 0 && g.rentProd != null && g.rentProd >= 0 && g.rentProd < 25 && (g.ventas7Prod >= 2 || g.ventasProd > 30) && !plataTirada.includes(g))
    .sort((a,b) => a.rentProd - b.rentProd);
  const candidatos = productos.filter(g => g.gastoProd === 0 && g.ventasProd >= 10 && g.rentSinAds != null && g.rentSinAds >= 40)
    .sort((a,b) => b.ventasProd - a.ventasProd);

  const badgesVariantes = (g) => g.vars.slice()
    .sort((a,b) => (a.con_cuotas?1:0) - (b.con_cuotas?1:0))
    .map(p => p.con_cuotas
      ? `<span class="badge-vinculo derivado" style="font-size:10px">${p.cuotas_cantidad || 3} cuotas</span>`
      : `<span class="badge-vinculo" style="font-size:10px; background:var(--surface-2); color:var(--muted)">1 pago</span>`)
    .join(' ');

  const filaProd = (g, color) => {
    const metric = g.sinVentasActiva
      ? `<b style="color:var(--hot)">0 ventas por pauta</b>`
      : `<b style="color:${color}">${g.rentProd != null ? g.rentProd.toFixed(0) : '—'}%</b> c/ADS`;
    return `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--border);">
      <span style="font-size:12.5px">${limpio(g.titulo)} ${badgesVariantes(g)}</span>
      <span style="font-size:11.5px; white-space:nowrap; text-align:right">
        ${metric} ·
        <span style="color:var(--muted)">ventas ${g.ventasProd} (7d: ${g.ventas7Prod}) · gasto ${fmtARS(g.gastoProd)}</span>
      </span>
    </div>`;
  };

  const filaCandidato = (g) => {
    const r = g.rentSinAds != null ? g.rentSinAds.toFixed(0) : '—';
    return `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--border);">
      <span style="font-size:12.5px">${limpio(g.titulo)} ${badgesVariantes(g)}</span>
      <span style="font-size:11.5px; white-space:nowrap; text-align:right">
        <b style="color:var(--ok)">${r}%</b> rent. ·
        <span style="color:var(--muted)">${g.ventasProd} ventas · ${g.visitas7Prod} visitas 7d · sin pauta</span>
      </span>
    </div>`;
  };

  const bloquePlata = plataTirada.length
    ? `<div style="background:color-mix(in srgb, var(--hot) 8%, transparent); border:1px solid color-mix(in srgb, var(--hot) 32%, transparent); border-radius:8px; padding:10px 14px; margin-bottom:8px;">
         <div style="font-weight:600; color:var(--hot); margin-bottom:4px; font-size:13px;">🔴 ${plataTirada.length} producto(s) gastan en pauta, no rinden ni venden — considerar pausar la publicidad del producto</div>
         ${plataTirada.map(g => filaProd(g, 'var(--hot)')).join('')}
         <div style="color:var(--muted); font-size:11px; margin-top:6px;">ML pauta el producto completo: la acción es pausar la publicidad de toda la publicación.</div>
       </div>` : '';

  const bloqueOptim = optimizar.length
    ? `<div style="background:color-mix(in srgb, var(--warn) 8%, transparent); border:1px solid color-mix(in srgb, var(--warn) 32%, transparent); border-radius:8px; padding:10px 14px; margin-bottom:8px;">
         <div style="font-weight:600; color:var(--warn); margin-bottom:4px; font-size:13px;">🟡 ${optimizar.length} producto(s) venden pero la pauta les come margen — bajar el ACOS (presupuesto/puja)</div>
         ${optimizar.map(g => filaProd(g, 'var(--warn)')).join('')}
       </div>` : '';

  const bloqueCandidatos = candidatos.length
    ? `<div style="background:color-mix(in srgb, var(--ok) 8%, transparent); border:1px solid color-mix(in srgb, var(--ok) 32%, transparent); border-radius:8px; padding:10px 14px; margin-bottom:8px;">
         <div style="font-weight:600; color:var(--ok); margin-bottom:4px; font-size:13px;">🚀 ${candidatos.length} producto(s) que venden bien y rinden, SIN publicidad — oportunidad de pautar para crecer</div>
         ${candidatos.slice(0,8).map(g => filaCandidato(g)).join('')}
         <div style="color:var(--muted); font-size:11px; margin-top:6px;">Ya funcionan solos con buen margen. Una pauta moderada podría darles más volumen sin arriesgar rentabilidad.</div>
       </div>` : '';

  const sinAlertas = (!plataTirada.length && !optimizar.length)
    ? `<div style="background:color-mix(in srgb, var(--ok) 6%, transparent); border:1px solid color-mix(in srgb, var(--ok) 25%, transparent); border-radius:8px; padding:8px 14px; font-size:13px; color:var(--ok);">✓ Ningún producto está gastando en pauta de forma ineficiente.</div>`
    : '';

  // Variantes con desbalance dentro de un mismo producto
  const variantesAlerta = [];
  for (const k of Object.keys(prod)) {
    const grupo = prod[k].vars;
    if (grupo.length < 2) continue;
    const gastoGrupo = grupo.reduce((a,p) => a + parseFloat(p.ads_total||0), 0);
    if (gastoGrupo <= 0) continue;
    const ord = grupo.slice().sort((a,b) => Number(b.ventas_total||0) - Number(a.ventas_total||0));
    const fuerte = ord[0];
    const debil = ord[ord.length - 1];
    const vFuerte = Number(fuerte.ventas_total || 0);
    const vDebil = Number(debil.ventas_total || 0);
    if (vFuerte > 0 && (vDebil === 0 || vDebil / vFuerte <= 0.25)) {
      const etiq = (p) => p.con_cuotas ? `${p.cuotas_cantidad || 3} cuotas` : '1 pago';
      variantesAlerta.push({
        titulo: fuerte.titulo,
        debilLabel: etiq(debil), fuerteLabel: etiq(fuerte),
        debilEsCuotas: !!debil.con_cuotas,
        vDebil, vFuerte,
        rentDebil: debil.rentabilidad_con_ads_pct != null ? parseFloat(debil.rentabilidad_con_ads_pct) : null,
        rentFuerte: fuerte.rentabilidad_con_ads_pct != null ? parseFloat(fuerte.rentabilidad_con_ads_pct) : null,
      });
    }
  }

  const badgeVar = (label, esCuotas) => esCuotas
    ? `<span class="badge-vinculo derivado" style="font-size:10px">${label}</span>`
    : `<span class="badge-vinculo" style="font-size:10px; background:var(--surface-2); color:var(--muted)">${label}</span>`;

  const bloqueVariantes = variantesAlerta.length
    ? `<div style="background:color-mix(in srgb, var(--accent) 6%, transparent); border:1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius:8px; padding:10px 14px; margin-bottom:8px;">
         <div style="font-weight:600; color:var(--accent); margin-bottom:4px; font-size:13px;">🔄 ${variantesAlerta.length} producto(s) con una variante que casi no vende — evaluar darla de baja en ML</div>
         ${variantesAlerta.map(v => `<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--border);">
           <span style="font-size:12.5px">${limpio(v.titulo)} dar de baja: ${badgeVar(v.debilLabel, v.debilEsCuotas)}</span>
           <span style="font-size:11.5px; white-space:nowrap; text-align:right; color:var(--muted)">
             <b>${v.fuerteLabel}:</b> ${v.vFuerte} ventas${v.rentFuerte!=null?` (${v.rentFuerte.toFixed(0)}%)`:''} ·
             <b>${v.debilLabel}:</b> ${v.vDebil} ventas${v.rentDebil!=null?` (${v.rentDebil.toFixed(0)}%)`:''}
           </span>
         </div>`).join('')}
         <div style="color:var(--muted); font-size:11px; margin-top:6px;">ML pauta todas las variantes juntas. Dar de baja en ML la variante que no vende hace que el producto deje de gastar pauta en esa opción.</div>
       </div>`
    : '';

  const totalAlertas = plataTirada.length + variantesAlerta.length;
  const badge = totalAlertas > 0
    ? `<span style="background:var(--hot); color:#fff; border-radius:10px; padding:1px 7px; font-size:11px; font-weight:600;">${totalAlertas}</span>`
    : `<span style="background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok); border-radius:10px; padding:1px 7px; font-size:11px;">✓</span>`;

  return `
    <details class="ads-panel" style="margin-bottom:14px; border:1px solid var(--border); border-radius:10px; overflow:hidden;">
      <summary style="cursor:pointer; padding:9px 14px; display:flex; align-items:center; gap:10px; font-size:13px; list-style:none; user-select:none;">
        <span style="font-weight:600;">📊 Publicidad</span>
        ${badge}
        <span style="color:var(--muted); font-weight:400;" title="${esc(tipVendra)}">gasto mes ${fmtARS(gastoTotal)} · 7d ${fmtARS(gasto7d)} · ${conAds.length} con ADS${vMes && vMes.display ? ` · incluye Display ${fmtARS(vMes.display)}` : ''}</span>
        <span style="color:var(--muted); margin-left:auto; font-size:11px;">ver detalle ▾</span>
      </summary>
      <div style="padding:12px 14px; background:var(--surface);">
        ${bloquePlata}${bloqueOptim}${bloqueVariantes}${bloqueCandidatos}${(!bloquePlata && !bloqueOptim && !bloqueVariantes && !bloqueCandidatos) ? sinAlertas : ''}
      </div>
    </details>`;
}

function renderGrupoML(g) {
  const esCombo = /combo/i.test(g.titulo || '') || g.rows.some(r => r.codigo_combo);
  const filas = g.rows.slice()
    .sort((a,b) => (a.con_cuotas?1:0) - (b.con_cuotas?1:0))
    .map(p => renderFilaPub(p, esCombo)).join('');

  const headerCls = esCombo ? ' ml-header-combo' : '';
  return `
    <div class="grupo" style="margin-bottom:12px;">
      <div class="grupo-head${headerCls}">
        <div class="n">${esc(cleanTitle(g.titulo || '—'))} ${esCombo ? '<span class="badge-vinculo desvinculado">combo</span>' : (g.sku ? `<span style="color:var(--muted); font-size:11px; font-weight:400;">· SKU ${esc(g.sku)}</span>` : '')}</div>
        <div class="c">${g.rows.length} publicación${g.rows.length !== 1 ? 'es' : ''}</div>
      </div>
      <table style="table-layout:fixed;">
        <thead>
          <tr>
            <th style="width:78px">Public.</th>
            <th>Título ML</th>
            <th style="width:88px">Tipo</th>
            <th style="width:62px">Cuotas</th>
            <th class="num" style="width:92px">Precio</th>
            <th class="num" style="width:82px">Costo</th>
            <th class="num" style="width:70px" title="Cargo fijo ML (productos por debajo del umbral de envío gratis)">Cargo fijo</th>
            <th class="num" style="width:70px" title="Costo de envío gratis (productos que superan el umbral)">Envío</th>
            <th style="width:110px" title="👁 visitas · 🛒 ventas — total (últimos 7 días)">Métricas</th>
            <th style="width:62px" title="Rentabilidad sin descontar publicidad">Rent.</th>
            <th style="width:78px" title="Rentabilidad descontando el gasto en publicidad acumulado (pasá el mouse para ver gasto y ACOS)">Con ADS</th>
            <th style="width:78px" title="Rentabilidad con ADS de los últimos 7 días — flecha muestra tendencia del ACOS">ADS 7d</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>
    </div>`;
}

function renderFilaPub(p, esCombo) {
  const tipoBadge = p.tipo_publicacion === 'catalogo'
    ? '<span class="badge-vinculo ancla" title="Publicación de catálogo">catálogo</span>'
    : '<span class="badge-vinculo desvinculado" title="Publicación tradicional">tradicional</span>';
  const cuotasBadge = p.con_cuotas
    ? `<span class="badge-vinculo derivado" title="Ofrece cuotas sin interés">${p.cuotas_cantidad || 3} cuotas</span>`
    : '<span style="color:var(--muted); font-size:11px;">—</span>';
  const costo = p.costo_neto != null ? fmtARS(parseFloat(p.costo_neto)) : '<span style="color:var(--muted);">sin costo</span>';
  const cargoFijo = parseFloat(p.cargo_fijo) > 0 ? fmtARS(parseFloat(p.cargo_fijo)) : '—';
  const envio = !p.envio_gratis
    ? '<span style="color:var(--muted); font-size:11px;" title="El envío lo paga el comprador, no es costo tuyo">comprador</span>'
    : (parseFloat(p.costo_envio) > 0 ? fmtARS(parseFloat(p.costo_envio)) : '—');
  const filaCls = esCombo ? ' class="ml-fila-combo"' : '';
  const tieneDesc = p.precio_con_descuento != null && parseFloat(p.precio_con_descuento) < parseFloat(p.precio);
  const precioCell = tieneDesc
    ? `<span style="color:var(--muted); text-decoration:line-through; font-size:11px;">${fmtARS(parseFloat(p.precio))}</span><br><span style="color:var(--accent); font-weight:600;">${fmtARS(parseFloat(p.precio_con_descuento))}</span>`
    : fmtARS(parseFloat(p.precio));
  const fmtMet = (total, d7) => {
    const t = total != null ? Number(total).toLocaleString('es-AR') : '—';
    const s = d7 != null ? Number(d7).toLocaleString('es-AR') : '0';
    return `${t} <span style="color:var(--muted); font-size:10px;">(${s})</span>`;
  };
  const metricasCell = `
    <div style="white-space:nowrap; font-size:12px;">
      <span title="Visitas: total (últimos 7 días)">👁 ${fmtMet(p.visitas_total, p.visitas_7d)}</span><br>
      <span title="Ventas: total (últimos 7 días)">🛒 ${fmtMet(p.ventas_total, p.ventas_7d)}</span>
    </div>`;
  return `
    <tr${filaCls}>
      <td class="codigo" title="${esc(p.item_id)}"><a href="${urlML(p.item_id)}" target="_blank" style="color:var(--accent); text-decoration:none;">${esc(p.item_id.replace('MLA',''))}</a></td>
      <td title="${esc(p.titulo || '')}" style="overflow:hidden; text-overflow:ellipsis;">${esc(cleanTitle(p.titulo || '—') || p.titulo || '—')}${p.activa ? '' : (esFinalizada(p) ? ' <span class="badge finalizada">finalizada</span>' : ' <span class="badge inactiva">pausada</span>')}${(!p.codigo_sku && !p.codigo_combo) ? ' <span class="badge sinsku" title="Sin SKU mapeado — no se calcula costo ni rentabilidad">sin SKU</span>' : ''}</td>
      <td>${tipoBadge}</td>
      <td>${cuotasBadge}</td>
      <td class="num">${precioCell}</td>
      <td class="num" style="color:var(--muted);">${costo}</td>
      <td class="num" style="color:var(--muted); font-size:11px;">${cargoFijo}</td>
      <td class="num" style="color:var(--muted); font-size:11px;">${envio}</td>
      <td>${metricasCell}</td>
      <td>${renderRentMLPill(p.rentabilidad_pct, p.costo_neto)}</td>
      <td>${renderAdsCell(p)}</td>
      <td>${renderAdsCell7d(p)}</td>
    </tr>`;
}

// Semáforo de rentabilidad ML: <30% error, 30-45 warn, ≥45 ok. Si no hay costo, "s/c".
function renderRentMLPill(pct, costoNeto) {
  if (costoNeto == null) return '<span class="rentab-pill empty" title="Falta el costo (combo a resolver)">s/c</span>';
  if (pct == null) return '<span class="rentab-pill empty">—</span>';
  const v = parseFloat(pct);
  const cls = v < 30 ? 'error' : v < 45 ? 'warn' : 'ok';
  return `<span class="rentab-pill ${cls}">${v.toFixed(0)}%</span>`;
}

// Rentabilidad CON ADS acumulada. Gasto y ACOS en tooltip. Señal ⚠ si cae >20 pts.
function renderAdsCell(p) {
  const adsTotal = parseFloat(p.ads_total || 0);
  if (p.costo_neto == null) return '<span class="rentab-pill empty">s/c</span>';
  if (adsTotal <= 0) return '<span style="color:var(--muted); font-size:11px;" title="Sin gasto en publicidad">sin ADS</span>';
  const acos = p.ads_acos != null ? `ACOS ${parseFloat(p.ads_acos).toFixed(0)}%` : '';
  const v = p.rentabilidad_con_ads_pct;
  const sinAds = p.rentabilidad_pct != null ? parseFloat(p.rentabilidad_pct) : null;
  const caida = (sinAds != null && v != null) ? (sinAds - parseFloat(v)) : null;
  const caidaTxt = caida != null ? ` · cae ${caida.toFixed(0)} pts por ADS` : '';
  const tip = esc(`Acumulado — Gasto ${fmtARS(adsTotal)} · ${acos}${caidaTxt}`);
  if (v == null) return `<span class="rentab-pill empty" title="${tip}">—</span>`;
  const n = parseFloat(v);
  const cls = n < 30 ? 'error' : n < 45 ? 'warn' : 'ok';
  const señal = (caida != null && caida > 20) ? '<span style="color:var(--hot); font-size:10px;" title="La publicidad se está comiendo más de 20 puntos de rentabilidad">⚠</span>' : '';
  return `<span style="display:inline-flex; align-items:center; gap:4px; white-space:nowrap;"><span class="rentab-pill ${cls}" title="${tip}">${n.toFixed(0)}%</span>${señal}</span>`;
}

// Rentabilidad CON ADS últimos 7 días. Flecha ▼ (mejor) / ▲ (peor) / ▬ (estable) del ACOS vs acumulado.
function renderAdsCell7d(p) {
  const ads7 = parseFloat(p.ads_7d || 0);
  if (p.costo_neto == null) return '<span class="rentab-pill empty">s/c</span>';
  if (ads7 <= 0) return '<span style="color:var(--muted); font-size:11px;" title="Sin gasto en publicidad en los últimos 7 días">sin ADS</span>';
  const acos7 = p.ads_acos_7d != null ? parseFloat(p.ads_acos_7d) : null;
  const acosAcum = p.ads_acos != null ? parseFloat(p.ads_acos) : null;
  let flecha = '';
  if (acos7 != null && acosAcum != null) {
    const dif = acos7 - acosAcum;
    if (dif <= -3) flecha = '<span style="color:var(--ok); font-size:11px;" title="El ACOS de esta semana es MEJOR (más bajo) que el promedio acumulado">▼</span>';
    else if (dif >= 3) flecha = '<span style="color:var(--hot); font-size:11px;" title="El ACOS de esta semana es PEOR (más alto) que el promedio acumulado">▲</span>';
    else flecha = '<span style="color:var(--muted); font-size:11px;" title="ACOS estable respecto al acumulado">▬</span>';
  }
  const acos = acos7 != null ? `ACOS ${acos7.toFixed(0)}%` : '';
  const tip = esc(`Últimos 7 días — Gasto ${fmtARS(ads7)} · ${acos}`);
  const v = p.rentabilidad_con_ads_7d_pct;
  if (v == null) return `<span class="rentab-pill empty" title="${tip}">—</span>`;
  const n = parseFloat(v);
  const cls = n < 30 ? 'error' : n < 45 ? 'warn' : 'ok';
  return `<span style="display:inline-flex; align-items:center; gap:4px; white-space:nowrap;"><span class="rentab-pill ${cls}" title="${tip}">${n.toFixed(0)}%</span>${flecha}</span>`;
}

let AUTO_PUBS_HECHO = false;
async function sincronizarPubs(auto) {
  const btn = $('#btnSyncPubs');
  btn.classList.add('spin'); btn.disabled = true;
  const prev = btn.innerHTML; btn.innerHTML = prev.replace('Sincronizar con ML', 'Sincronizando…');
  try {
    const { data, error } = await sb.functions.invoke('ml-sync', { body: {} });
    if (error) throw new Error(error.message);
    if (data && data.ok === false) throw new Error(data.error || 'Error');
    const partes = [];
    if (data.nuevas) partes.push(`+${data.nuevas} nuevas`);
    if (data.eliminadas) partes.push(`−${data.eliminadas} eliminadas`);
    partes.push(`${data.actualizadas} actualizadas`);
    if (auto !== true || data.nuevas || data.eliminadas) toast('✓ ' + partes.join(' · '), 'ok');
    await cargarPublicaciones();
  } catch (err) { toast('Error: ' + err.message, 'err'); }
  finally { btn.classList.remove('spin'); btn.disabled = false; btn.innerHTML = prev; }
}

// Al abrir la pantalla se trae la publicidad al día (ML + Vendra) sin tocar ningún botón. Una sola vez
// por visita, y no si se trajo hace menos de 5 minutos (abrir y cerrar la pestaña no dispara de nuevo).
let AUTO_ADS_HECHO = false;
async function autoSyncAds() {
  if (AUTO_ADS_HECHO) return;
  AUTO_ADS_HECHO = true;
  const ult = VENDRA_PUB.mes && VENDRA_PUB.mes.traido_en ? new Date(VENDRA_PUB.mes.traido_en).getTime() : 0;
  if (Date.now() - ult < 5 * 60 * 1000) return;
  const btn = $('#btnSyncAds');
  const prev = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Actualizando ADS…'; }
  try {
    const { data, error } = await sb.functions.invoke('ml-ads-sync', { body: {} });
    if (error || (data && data.ok === false)) return; // silencioso: quedan los últimos números y el botón sigue disponible
    if ($('#panel-ads-ml')) await cargarPublicaciones();
  } catch (_) { /* silencioso */ }
  finally { const b = $('#btnSyncAds'); if (b) { b.disabled = false; b.textContent = prev || 'Sincronizar gasto ADS'; } }
}

async function sincronizarAdsGasto() {
  const btn = $('#btnSyncAds');
  const prev = btn.textContent; btn.disabled = true; btn.textContent = 'Sincronizando ADS…';
  try {
    const { data, error } = await sb.functions.invoke('ml-ads-sync', { body: {} });
    if (error) throw new Error(error.message);
    if (data && data.ok === false) throw new Error(data.error || 'Error');
    const partes = [`${data.guardadas} publicaciones`];
    if (data.conGasto) partes.push(`${data.conGasto} con gasto`);
    if (data.gastoMes != null) partes.push(`gasto mes ${fmtARS(data.gastoMes)}`);
    toast('✓ ADS · ' + partes.join(' · '), 'ok');
    await cargarPublicaciones();
  } catch (err) { toast('Error: ' + err.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = prev; }
}

// ─────── 3.2) SUB-TAB PUBLICIDAD (v3, nov-2026) ───────
// Publicidad inteligente. Datos: ml-ads-auto {accion:'traer_ads'} (cron diario + tarea de los lunes y jueves)
// → ml_ads_metricas (por anuncio), ml_ads_campanas (objetivo y presupuesto), ml_ads_diario (gasto y ventas por día).
// v_ml_ads_analisis compara cada anuncio con la campaña que le corresponde según su ACOS objetivo
// (tabla ml_ads_bandas) usando el margen real de hoy (v_ml_promo_control). Mercado Ads no deja escribir por API:
// los cambios los aplica la tarea programada desde Chrome y quedan en ml_ads_bitacora.
const ADS_REC = {
  pausar: { k: 'mal', txt: 'Pausar' }, mover: { k: 'exc', txt: 'Mover de campaña' }, activar: { k: 'ok', txt: 'Activar' },
  mantener: { k: 'ok', txt: 'Mantener' }, sin_publicidad: { k: 'sin', txt: 'Sin publicidad' },
};
const ADS_ESTADO = { active: 'activo', paused: 'pausado', idle: 'sin circular', hold: 'en espera', 'sin anuncio': 'sin anuncio' };
const numAR = t => String(t || '').replace(/d[d.,]*d/g, m => m.replace(/[.,]/g, c => c === '.' ? ',' : '.'));
const ADS_ACCION = { pausar: 'Pausó', activar: 'Activó', mover: 'Movió', reestructura: 'Reorganizó campañas', pausar_display: 'Pausó la campaña de seguidores' };
let ADS = { rows: [], camps: [], bandas: [], sem: [], bit: [], vendra: {} };

async function cargarPublicidad() {
  const el = $('#sub-ads');
  el.innerHTML = '<div class="empty-box">Cargando publicidad…</div>';
  const [a, c, bd, s, bi, v, m] = await Promise.all([
    sb.from('v_ml_ads_analisis').select('*'),
    sb.from('ml_ads_campanas').select('*'),
    sb.from('ml_ads_bandas').select('*').order('acos_min', { ascending: false }),
    sb.from('v_ml_ads_semanal').select('*').order('semana', { ascending: false }).limit(10),
    sb.from('ml_ads_bitacora').select('*').neq('accion', 'corrida').order('ejecutado_en', { ascending: false }).limit(25),
    sb.from('ml_vendra_resumen').select('clave,desde,hasta,publicidad,display,ventas'),
    sb.from('ml_ads_metricas').select('traido_en,desde,hasta').eq('ventana', '30d').order('traido_en', { ascending: false }).limit(1),
  ]);
  const err = [a, c, bd, s, bi].find(x => x.error);
  if (err) { el.innerHTML = `<div class="empty-box" style="color:var(--hot);">Error: ${esc(err.error.message)}</div>`; return; }
  ADS = { rows: a.data || [], camps: c.data || [], bandas: bd.data || [], sem: s.data || [], bit: bi.data || [], vendra: {}, meta: (m.data || [])[0] };
  (v.data || []).forEach(x => ADS.vendra[x.clave] = x);
  renderPublicidad();
}

async function actualizarAdsComp(accion, btnSel, luego) {
  const b = $(btnSel); const prev = b.textContent; b.disabled = true; b.textContent = 'Leyendo Mercado Libre…';
  try {
    const { data, error } = await sb.functions.invoke('ml-ads-auto', { body: { accion } });
    if (error) throw new Error(error.message);
    if (data && data.ok === false) throw new Error(data.error || 'Error');
    toast('✓ Actualizado', 'ok');
    await luego();
  } catch (err) { toast('Error: ' + err.message, 'err'); b.disabled = false; b.textContent = prev; }
}

// ─────── SUB-TAB COMPETENCIA (v2, nov-2026) ───────
// ml-ads-auto {accion:'competencia'} (cron diario ml-ads-competencia): por cada búsqueda de
// ml_competencia_busquedas trae los productos de catálogo del mismo tipo (filtros incluye/excluye) y tamaño,
// su precio más bajo, vendedores y Full; los "más vendidos" de cada categoría (ml_competencia_top) y avisa por
// mail si la competencia baja fuerte o aparece alguien más barato. Lo marcado "No es competencia" va a
// ml_competencia_excluidos. Solo ve productos de catálogo: las publicaciones sueltas no salen por la API.
const COMP_CAT = { MLA392701: 'Cuidado Corporal', MLA455813: 'Geles Conductores' };
let COMP = { res: [], det: [], top: [], ult: null };

async function cargarCompetencia() {
  const el = $('#sub-comp');
  el.innerHTML = '<div class="empty-box">Cargando competencia…</div>';
  const [r, d, t] = await Promise.all([
    sb.from('v_ml_competencia_resumen').select('*'),
    sb.from('ml_competencia').select('*').order('fecha', { ascending: false }).order('precio').limit(600),
    sb.from('ml_competencia_top').select('*').order('fecha', { ascending: false }).order('posicion').limit(80),
  ]);
  if (r.error) { el.innerHTML = `<div class="empty-box" style="color:var(--hot);">Error: ${esc(r.error.message)}</div>`; return; }
  const ult = (r.data || [])[0]?.fecha;
  COMP = { res: r.data || [], det: (d.data || []).filter(x => x.fecha === ult), top: (t.data || []).filter(x => x.fecha === (t.data || [])[0]?.fecha), ult };
  renderCompetencia();
}

function sparkComp(serie) {
  const s = (serie || []).filter(p => p.min != null);
  if (s.length < 2) return '<span class="pct-ok" style="font-size:11px;">se arma con los días</span>';
  const vals = s.flatMap(p => [Number(p.min), Number(p.med)]), mn = Math.min(...vals), mx = Math.max(...vals) || 1;
  const W = 90, H = 26, x = i => (i * W / (s.length - 1)).toFixed(1), y = v => (H - 2 - (H - 4) * (v - mn) / Math.max(1, mx - mn)).toFixed(1);
  const linea = k => s.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(Number(p[k]))}`).join(' ');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="Precio de la competencia en 30 días"><path d="${linea('med')}" fill="none" stroke="var(--muted)" stroke-width="1.5"/><path d="${linea('min')}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

function renderCompetencia() {
  const el = $('#sub-comp');
  const { res, det, top, ult } = COMP;
  const minMg = PAUTO_PAR.promos_margen_min_pct ?? 20;
  const conComp = res.filter(x => Number(x.n) > 0);
  const filas = res.slice().sort((a, b) => (Number(b.vs_mediana_pct ?? -999) - Number(a.vs_mediana_pct ?? -999)));
  const caros = conComp.filter(x => Number(x.vs_mediana_pct) > 30).length;
  const alertas = res.filter(x => x.cambio_min_7d_pct != null && Number(x.cambio_min_7d_pct) <= -10);
  const compsHoy = det.filter(c => !c.es_rosaint);
  const pctFull = compsHoy.length ? Math.round(100 * compsHoy.filter(c => c.es_full).length / compsHoy.length) : null;
  const promVs = conComp.length ? Math.round(conComp.reduce((s, x) => s + Number(x.vs_mediana_pct || 0), 0) / conComp.length) : null;
  const mgCls = v => v == null ? 'pct-ok' : Number(v) < minMg ? 'mg-mal' : Number(v) < minMg + 5 ? 'mg-justo' : 'mg-bien';
  const catDe = id => (det.find(c => c.item_id === id && c.categoria) || {}).categoria;

  const fila = x => {
    const comps = det.filter(c => c.item_id === x.item_id && !c.es_rosaint);
    const vs = x.vs_mediana_pct == null ? '<span class="pct-ok">—</span>'
      : `<span class="${Number(x.vs_mediana_pct) > 30 ? 'mg-mal' : Number(x.vs_mediana_pct) > 10 ? 'mg-justo' : 'mg-bien'}">${Number(x.vs_mediana_pct) > 0 ? '+' : ''}${x.vs_mediana_pct}%</span>`;
    const cat = catDe(x.item_id);
    return `<tr>
      <td><details><summary style="cursor:pointer;">${esc(cleanTitle(x.titulo))}</summary>
        ${comps.length ? `<div class="comp-det">${comps.map(c => `<div>

// Lo que la API de ML puede confirmar se actualiza solo con "Verificar con ML".
// Lo que NO expone la API se edita a mano desde la Ayuda oficial y queda con su
// fuente y su fecha a la vista:
//   · el cargo fijo por PESO (listing_prices ignora el peso y devuelve el mínimo)
//   · el envío por debajo de $33.000 (ahí el envío gratis es opcional, no se cotiza)
//   · el costo de las cuotas (la API informa el add-on de Premium, no el de "3 cuotas")

let ML_COSTO_UNIDAD = [], ML_COSTO_ENVIO = [], ML_CUOTAS = [], ML_SYNC = [];

const AYUDA_ML = {
  unidad: 'https://www.mercadolibre.com.ar/ayuda/cambios-costos-venta_42400',
  envio:  'https://www.mercadolibre.com.ar/ayuda/40538',
  cuotas: 'https://www.mercadolibre.com.ar/ayuda/Costos-para-vender-productos_870',
};
const fFechaHora = f => f
  ? new Date(f).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
  : '—';
const fPeso = kg => Number(kg) >= 99999 ? 'más de 15 kg' : `hasta ${Number(kg)} kg`;
const fFranja = (d, h) => h == null ? `${fmtARS(d)} o más`
  : (Number(d) === 0 ? `hasta ${fmtARS(h)}` : `${fmtARS(d)} a ${fmtARS(h)}`);

// Pivot: filas = tramo de peso, columnas = franja de precio.
function tablaPorPeso(filas, campo, pesosUsados) {
  const franjas = [...new Map(filas.map(r => [String(r.precio_desde),
    { d: Number(r.precio_desde), h: r.precio_hasta == null ? null : Number(r.precio_hasta) }])).values()]
    .sort((a, b) => a.d - b.d);
  const pesos = [...new Set(filas.map(r => Number(r.peso_hasta_kg)))].sort((a, b) => a - b);
  return `
    <table class="tbl">
      <thead><tr><th>Peso facturable</th>${franjas.map(f => `<th class="num">${fFranja(f.d, f.h)}</th>`).join('')}</tr></thead>
      <tbody>${pesos.map(p => {
        const usado = pesosUsados.has(p);
        return `<tr${usado ? ' style="background:var(--surface-2);"' : ''}>
          <td style="font-weight:${usado ? 600 : 400};">${fPeso(p)}${usado ? ' <span class="pill muted">tus productos</span>' : ''}</td>
          ${franjas.map(f => {
            const c = filas.find(r => Number(r.peso_hasta_kg) === p && Number(r.precio_desde) === f.d);
            return `<td class="num">${c ? fmtARS(c[campo]) : '—'}</td>`;
          }).join('')}
        </tr>`;
      }).join('')}</tbody>
    </table>`;
}

    sb.from('ml_costo_envio').select('*').eq('vigente', true).order('precio_desde').order('peso_hasta_kg'),
    sb.from('ml_costo_cuotas').select('*').eq('vigente', true).order('cuotas_cantidad'),
    sb.from('ml_costos_sync').select('*').order('corrido_en', { ascending: false }).limit(40),

  ML_COSTO_UNIDAD = unidad.data || [];

          Si el precio final cruza ese valor, el envío gratis pasa a ser obligatorio y lo pagás vos.
          ${alBorde.map(p => `<div style="margin-top:4px;">· <b>${esc((p.titulo || '').slice(0, 42))}</b> —
            a ${fmtARS(p.falta_para_umbral)} del umbral; cruzarlo cuesta
            <b style="color:var(--hot);">${Number(p.costo_cruzar_umbral_pts || 0).toFixed(1)} puntos</b> de margen</div>`).join('')}
        </div>
      </div>` : ''}

    <div class="save-row" style="margin:14px 0 6px;">
      <span class="spacer"></span>
      <span class="status" id="ml-sync-status"></span>
      <button class="btn" id="ml-sync-dry">Verificar sin aplicar</button>

    <details class="config-box" open>

      <div class="cfg-body">

          <thead><tr><th>Clave</th><th class="num">Valor</th><th>Qué es</th><th class="date">Actualizado</th></tr></thead>
          <tbody>${ML_PARAMS.map(p => `
            <tr data-clave="${esc(p.clave)}">
              <td class="mono" style="color:var(--accent);">${esc(p.clave)}</td>
              <td class="num"><input type="number" step="0.00001" class="inline-edit ml-param-val" value="${p.valor ?? ''}"></td>

function renderHistorialSync() {

  return `
    <table class="tbl">
      <thead><tr><th class="date">Cuándo</th><th>Concepto</th><th class="num">Antes</th><th class="num">Ahora</th><th>Estado</th></tr></thead>

        <tr>
          <td class="date">${fFechaHora(h.corrido_en)}</td>
          <td>${esc(h.concepto)}${h.detalle ? `<div class="muted" style="font-size:11px;">${esc(h.detalle)}</div>` : ''}</td>

          <td><span class="pill ${h.origen === 'manual' ? 'warn' : (h.coincide ? 'ok' : 'hot')}">${
            h.origen === 'manual' ? 'revisar a mano' : (h.coincide ? 'sin cambios' : 'cambió')}</span></td>
        </tr>`).join('')}

// Corre ml-costos-sync. Con aplicar=false solo informa; con true escribe los
// valores que la API confirmó (nunca toca las tablas que ML no expone).
async function verificarCostosML(aplicar) {
  const btns = [$('#ml-sync-run'), $('#ml-sync-dry')];
  btns.forEach(b => b && (b.disabled = true));
  const st = $('#ml-sync-status');
  st.textContent = 'Consultando a Mercado Libre…'; st.className = 'status';
  try {
    const { data, error } = await sb.functions.invoke('ml-costos-sync', { body: { aplicar } });
    if (error) throw error;
    if (!data?.ok) throw new Error(data?.error || 'Respuesta inesperada');
    const r = data.resumen;
    st.textContent = `✓ ${r.verificados} verificados · ${r.con_cambio} con cambio · ${r.a_revisar_a_mano} a mano`;
    st.className = 'status ' + (r.con_cambio ? 'err' : 'ok');
    toast(aplicar
      ? `Costos verificados: ${r.con_cambio} actualizados`
      : `Verificación sin aplicar: ${r.con_cambio} diferencias`, r.con_cambio ? 'warn' : 'ok');
    await cargarConfigML();
    if (aplicar && r.con_cambio) await cargarPublicaciones();
  } catch (err) {
    st.textContent = '✗ ' + (err.message || err); st.className = 'status err';
    toast('No se pudo verificar: ' + (err.message || err), 'err');
  } finally { btns.forEach(b => b && (b.disabled = false)); }
}

async function guardarMLParams() {
  const btn = $('#ml-params-save'); btn.disabled = true;
  const st = $('#ml-params-status'); st.textContent = 'Guardando…'; st.className = 'status';
  try {
    for (const tr of $$('#sub-cfg tr[data-clave]')) {
      const clave = tr.dataset.clave;
      const valor = parseFloat(tr.querySelector('.ml-param-val').value);
      const { error } = await sb.from('ml_parametros')
        .update({ valor: isNaN(valor) ? null : valor, actualizado_en: new Date().toISOString() })
        .eq('clave', clave);
      if (error) throw new Error(clave + ': ' + error.message);
    }
    st.textContent = '✓ Guardado'; st.className = 'status ok';
    toast('Parámetros actualizados', 'ok');
    await cargarPublicaciones();
  } catch (err) { st.textContent = '✗ ' + err.message; st.className = 'status err'; toast('Error: ' + err.message, 'err'); }
  finally { btn.disabled = false; }
}

async function guardarMLCuotas() {
  const btn = $('#ml-cuotas-save'); btn.disabled = true;
  const st = $('#ml-cuotas-status'); st.textContent = 'Guardando…'; st.className = 'status';
  try {
    for (const tr of $$('#sub-cfg tr[data-cuota]')) {
      const n = Number(tr.dataset.cuota);
      const valor = parseFloat(tr.querySelector('.ml-cuota-val').value);
      if (isNaN(valor)) continue;
      const { error } = await sb.from('ml_costo_cuotas')
        .update({ costo_pct: valor, actualizado_en: new Date().toISOString(), fuente: 'manual' })
        .eq('cuotas_cantidad', n);
      if (error) throw new Error(n + ' cuotas: ' + error.message);
    }
    st.textContent = '✓ Guardado'; st.className = 'status ok';
    toast('Costo de cuotas actualizado', 'ok');
    await cargarPublicaciones();
  } catch (err) { st.textContent = '✗ ' + err.message; st.className = 'status err'; toast('Error: ' + err.message, 'err'); }
  finally { btn.disabled = false; }
}

// ═══════════════════════════════════════════════════════════════════════════
// SUB-TAB PRECIOS SUGERIDOS
//
// Cuánto habría que cobrar para recuperar el margen que cada publicación tenía
// antes del aumento de ML del 01-09-2026, sin cruzar el umbral de envío gratis.
// Es una propuesta: no escribe nada en Mercado Libre.
// ═══════════════════════════════════════════════════════════════════════════
let SUGERIDOS = [];

let ESCALONES = [];

// ─────── Meli+ y escalones de cargo fijo ───────
// Dos efectos que solo se ven mirando el precio contra los cortes de ML:
//  · el 5% extra de Meli+ cuesta plata, salvo que el descuento cruce un corte hacia
//    abajo — ahí el ahorro de cargo fijo puede más que compensar
//  · un precio apenas ARRIBA de un corte paga el escalón entero en todas las ventas
function renderEscalones() {
  if (!ESCALONES.length) return '';
  const conMeli = ESCALONES.filter(e => Number(e.pn) !== Number(e.pm));
  const malUbicadas = ESCALONES.filter(e => e.conviene_bajar);

  return `
    ${malUbicadas.length ? `
      <div class="canal-hint ml" style="border-color:var(--ok); margin-top:18px;">
        <span class="icon">💡</span>
        <div class="txt">
          <b>${malUbicadas.length} precio${malUbicadas.length > 1 ? 's mal ubicados' : ' mal ubicado'} respecto del corte de ML</b>
          Están apenas por encima de un corte de cargo fijo. Bajarlos unos pesos ahorra el escalón
          entero, en todas las ventas — sin subir nada.
          ${malUbicadas.map(e => `<div style="margin-top:4px;">· <b>${esc((e.titulo || '').slice(0, 40))}</b> —
            hoy ${fmtARS(e.pn)} (${e.arriba_del_corte > 0 ? fmtARS(e.arriba_del_corte) + ' arriba del corte' : 'justo en el corte'}):
            bajando a ${fmtARS(Number(e.pn) - Number(e.arriba_del_corte) - 1)} ahorrás
            <b style="color:var(--ok);">${fmtARS(e.ahorro_si_baja)} por unidad</b>
            y el margen pasa de ${Number(e.margen_normal_pct).toFixed(1)}% a
            <b style="color:var(--ok);">${Number(e.margen_si_baja_pct).toFixed(1)}%</b></div>`).join('')}
        </div>
      </div>` : ''}

    <details class="config-box" style="margin-top:18px;">
      <summary>Qué te cuesta cada venta Meli+
        <span class="sub">— el 5% extra de descuento, publicación por publicación</span></summary>
      <div class="cfg-body">
        <p class="muted" style="font-size:12.5px; margin:0 0 10px;">
          A los compradores Meli+ se les hace 5 puntos más de descuento. Casi siempre eso baja el
          margen, pero cuando el descuento cruza un corte de cargo fijo hacia abajo el ahorro puede
          más que compensar: ahí el margen Meli+ sale <b>mejor</b> que el normal (en plata igual entra menos).
        </p>
        <table class="tbl">
          <thead><tr>
            <th>Producto</th><th class="num">Precio normal</th><th class="num">Precio Meli+</th>
            <th class="num">Margen normal</th><th class="num">Margen Meli+</th>
            <th class="num">Diferencia</th><th class="num">Deja de entrar</th>
          </tr></thead>
          <tbody>${conMeli.map(e => {
            const dif = Number(e.margen_meli_pct) - Number(e.margen_normal_pct);
            return `<tr>
              <td>${esc((e.titulo || '').slice(0, 36))}<div class="muted" style="font-size:11px;">${esc(e.codigo_sku || '')}</div></td>
              <td class="num">${fmtARS(e.pn)}</td>
              <td class="num">${fmtARS(e.pm)}</td>
              <td class="num muted">${Number(e.margen_normal_pct).toFixed(1)}%</td>
              <td class="num"><span class="pill ${dif >= 0 ? 'ok' : 'hot'}">${Number(e.margen_meli_pct).toFixed(1)}%</span></td>
              <td class="num" style="color:${dif >= 0 ? 'var(--ok)' : 'var(--hot)'};">${dif >= 0 ? '+' : ''}${dif.toFixed(1)} pts</td>
              <td class="num">${fmtARS(e.pierde_por_meli)}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </details>`;
}

async function cargarPreciosSugeridos() {
  const [sug, esc_] = await Promise.all([
    sb.from('v_ml_precios_sugeridos').select('*'),
    sb.from('v_ml_escalones').select('*'),
  ]);
  const { data, error } = sug;
  ESCALONES = (esc_.data || []).sort((a, b) => String(a.codigo_sku).localeCompare(String(b.codigo_sku)));
  if (error) { $('#sub-precios').innerHTML = `<div class="muted">Error: ${esc(error.message)}</div>`; return; }
  // Orden por código de SKU: agrupa por familia y de menor a mayor tamaño
  // (10201/10202/10203 = Clásica 1, 4 y 10 kg), que es como se lee el catálogo.
  SUGERIDOS = (data || []).sort((a, b) => String(a.codigo_sku).localeCompare(String(b.codigo_sku)));

  const conSuba = SUGERIDOS.filter(s => Number(s.suba_pct) > 0);
  const topeadas = SUGERIDOS.filter(s => s.topeado_por_umbral);
  const subaProm = conSuba.length
    ? conSuba.reduce((a, s) => a + Number(s.suba_pct), 0) / conSuba.length : 0;
  const caidaProm = SUGERIDOS.length
    ? SUGERIDOS.reduce((a, s) => a + Number(s.caida_pts || 0), 0) / SUGERIDOS.length : 0;

  $('#sub-precios').innerHTML = `
    <div class="canal-hint ml">
      <span class="icon">🧮</span>
      <div class="txt">
        <b>Precios para recuperar el margen anterior</b>
        Cuánto habría que cobrar para volver a la rentabilidad que cada publicación tenía antes del
        aumento de costos del 1 de septiembre. Ninguna propuesta cruza los ${fmtARS(SUGERIDOS[0]?.umbral_envio || 33000)}:
        si para llegar al margen habría que pasarlo, se topea y se marca.
        <b>Esto no modifica nada en Mercado Libre.</b>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi hot"><div class="v">${caidaProm.toFixed(1)} pts</div><div class="l">Margen perdido (promedio)</div></div>
      <div class="kpi"><div class="v">${conSuba.length}</div><div class="l">Publicaciones a ajustar</div></div>
      <div class="kpi"><div class="v">+${subaProm.toFixed(1)}%</div><div class="l">Suba promedio necesaria</div></div>
      <div class="kpi warn"><div class="v">${topeadas.length}</div><div class="l">Frenadas por el umbral</div></div>
    </div>

    <table class="tbl">
      <thead><tr>
        <th>Producto</th><th class="num">Publicado hoy</th><th class="num">Desc. real</th>
        <th class="num">Precio efectivo</th><th class="num">Margen antes</th><th class="num">Margen hoy</th>
        <th class="num">Efectivo sugerido</th><th class="num">A publicar</th><th class="num">Suba</th><th>Umbral</th>
      </tr></thead>
      <tbody>${SUGERIDOS.map(s => {
        const suba = Number(s.suba_pct ?? 0);
        const zona = s.topeado_por_umbral ? 'hot' : (s.zona_umbral === 'al borde' ? 'warn' : 'muted');
        const zonaTxt = s.topeado_por_umbral ? 'topeado' : (s.zona_umbral === 'al borde' ? 'al borde' : s.zona_umbral);
        // Con menos de 3 unidades vendidas no hay promedio confiable: ahí el
        // precio efectivo es el precio_meli cargado, y se avisa.
        const flojo = s.origen_precio !== 'ventas';
        return `<tr>
          <td>${esc((s.titulo || '').slice(0, 40))}<div class="muted" style="font-size:11px;">${esc(s.codigo_sku || '')} · ${Number(s.peso_kg || 0)} kg</div></td>
          <td class="num">${fmtARS(s.precio_publicado)}</td>
          <td class="num muted">${Number(s.descuento_pct || 0).toFixed(1)}%</td>
          <td class="num" title="${flojo
            ? 'Sin ventas suficientes en los últimos 60 días: se usa el precio con descuento Meli, que es el más bajo cargado'
            : 'Promedio real de ' + s.uds_efectivo + ' unidades vendidas en los últimos 60 días'}">
            ${fmtARS(s.precio_efectivo)}
            <div class="muted" style="font-size:11px;">${flojo ? '⚠ sin ventas' : s.uds_efectivo + ' u. reales'}</div></td>
          <td class="num muted">${Number(s.rent_anterior).toFixed(1)}%</td>
          <td class="num"><span class="pill ${Number(s.caida_pts) < 0 ? 'hot' : 'ok'}" title="Cambio: ${Number(s.caida_pts).toFixed(1)} pts">${Number(s.rent_hoy).toFixed(1)}%</span></td>
          <td class="num" style="font-weight:600;">${fmtARS(s.precio_efectivo_sug)}</td>
          <td class="num" style="font-weight:600; color:var(--accent);">${fmtARS(s.precio_publicado_sug)}</td>
          <td class="num" style="font-weight:600; color:${suba > 0 ? 'var(--hot)' : 'var(--ok)'};">${suba > 0 ? '+' : ''}${suba.toFixed(1)}%</td>
          <td><span class="pill ${zona}" title="${s.topeado_por_umbral
            ? 'Para recuperar el margen habría que cruzar el umbral: se topea en $32.999'
            : 'Faltan ' + fmtARS(s.falta_para_umbral) + ' para el umbral'}">${zonaTxt}</span></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <p class="muted" style="font-size:12px; margin:10px 0 0;">
      El margen se mide sobre el <b>precio efectivo</b>: el promedio real de venta de los últimos
      60 días según las órdenes de ML, no el precio de lista ni el precio con descuento teórico.
      Entre promociones de ML, Meli+ y los descuentos propios, lo que entra por venta es más bajo.
    </p>

    ${renderEscalones()}

    ${topeadas.length ? `
      <div class="canal-hint ml" style="border-color:var(--warn); margin-top:14px;">
        <span class="icon">🧱</span>
        <div class="txt">
          <b>${topeadas.length} publicación${topeadas.length > 1 ? 'es no llegan' : ' no llega'} al margen anterior</b>
          Subirlas lo necesario las pasaría de los ${fmtARS(SUGERIDOS[0]?.umbral_envio || 33000)} y el envío gratis
          se comería más de lo que se gana. Quedan topeadas abajo del umbral:
          ${topeadas.map(t => `<div style="margin-top:4px;">· <b>${esc((t.titulo || '').slice(0, 40))}</b> —
            tope ${fmtARS(t.precio_efectivo_sug)} (margen ${Number(t.rent_hoy).toFixed(1)}% contra
            ${Number(t.rent_anterior).toFixed(1)}% de antes)</div>`).join('')}
          <div style="margin-top:6px;">Para estas conviene bajar el costo o el peso del paquete, no subir el precio.</div>
        </div>
      </div>` : ''}
  `;
}

// ─── Arranque ───
(async () => {
  await cargarComun();
  await Promise.all([cargarDirecta(), cargarTN(), cargarML()]);
})();
</script>
