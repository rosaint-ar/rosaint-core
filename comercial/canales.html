<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canales · Rosaint CORE</title>
  <meta name="app-root" content="../">
  <link rel="icon" type="image/svg+xml" href="../shell/logo.svg">
  <link rel="stylesheet" href="../shell/shell.css">
  <style>
    /* ---- Tabs principales de canal ---- */
    .canal-tabs {
      display: flex; gap: 6px; margin-bottom: 16px;
      background: var(--surface-2); border-radius: var(--radius-sm);
      padding: 4px;
    }
    .canal-tab {
      flex: 1; padding: 11px 16px; border-radius: var(--radius-sm);
      background: none; border: none; cursor: pointer;
      font-size: 13.5px; font-weight: 600; color: var(--muted);
      transition: background .12s, color .12s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .canal-tab:hover { color: var(--text); }
    .canal-tab.active {
      background: var(--surface); color: var(--text);
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .canal-tab .icon { font-size: 18px; }

    /* ---- Sub-tabs del canal ML ---- */
    .subtabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .subtab {
      padding: 9px 16px; font-size: 13.5px; font-weight: 500;
      color: var(--muted); border-bottom: 2px solid transparent;
      margin-bottom: -1px; transition: color .12s, border-color .12s;
      background: none; border-left: none; border-right: none; border-top: none;
      cursor: pointer;
    }
    .subtab:hover { color: var(--text); }
    .subtab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

    /* ---- Config colapsable ---- */
    details.config-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 14px; overflow: hidden;
    }
    details.config-box[open] { padding-bottom: 4px; }
    details.config-box > summary {
      list-style: none; cursor: pointer; user-select: none;
      padding: 12px 18px; display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 600; color: var(--text);
      transition: background .12s;
    }
    details.config-box > summary::-webkit-details-marker { display: none; }
    details.config-box > summary:hover { background: var(--surface-2); }
    details.config-box > summary::before {
      content: '▸'; color: var(--muted); font-size: 10px;
      transition: transform .15s; display: inline-block;
    }
    details.config-box[open] > summary::before { transform: rotate(90deg); }
    details.config-box > summary .sub {
      font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px;
    }
    details.config-box > .cfg-body { padding: 4px 18px 16px; }

    .canal-hint {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px;
      display: flex; align-items: center; gap: 12px; font-size: 13px;
      color: var(--muted);
    }
    .canal-hint.directa { border-left: 4px solid var(--accent); }
    .canal-hint.tn { border-left: 4px solid #2a6db5; }
    .canal-hint.ml { border-left: 4px solid #b8860b; }
    .canal-hint .icon { font-size: 22px; flex-shrink: 0; }
    .canal-hint .txt { flex: 1; }
    .canal-hint .txt b { color: var(--text); font-size: 14px; display: block; margin-bottom: 2px; }
    .canal-hint .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .canal-hint .actions .btn { padding: 5px 12px; font-size: 12.5px; }

    .field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 16px; }
    .field label {
      display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); font-weight: 600; margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
      font: inherit;
    }
    .field input:focus, .field select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-tint);
    }
    .field .help { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .save-row {
      display: flex; gap: 10px; align-items: center; margin-top: 12px;
      padding-top: 12px; border-top: 1px solid var(--border);
    }
    .save-row .spacer { flex: 1; }
    .save-row .status { font-size: 12px; color: var(--muted); }
    .save-row .status.ok { color: var(--ok); }
    .save-row .status.err { color: var(--hot); }

    .medio-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px;
    }
    .medio-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .plazo-row {
      display: flex; align-items: center; gap: 10px; padding: 5px 0;
      border-bottom: 1px dashed var(--border);
    }
    .plazo-row:last-child { border-bottom: none; }
    .plazo-row label {
      display: flex; align-items: center; gap: 8px; flex: 1; font-size: 12.5px;
      cursor: pointer; margin: 0; text-transform: none; letter-spacing: 0; color: var(--text); font-weight: 500;
    }
    .plazo-row input[type=radio] { width: auto; margin: 0; }
    input.inline-edit {
      width: 100px; padding: 5px 8px; border: 1px solid var(--border);
      border-radius: 4px; background: var(--surface); color: var(--text);
      font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; text-align: right;
    }
    input.inline-edit:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-tint); }

    .main-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px 18px; margin-bottom: 14px;
    }
    .main-section > .head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .main-section > .head h3 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .main-section > .head .sub { font-size: 12.5px; color: var(--muted); }

    .grid-toolbar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .grid-toolbar .search { flex: 1; min-width: 220px; }
    .grid-toolbar .search input { width: 100%; }
    .grid-toolbar select {
      padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font: inherit; min-width: 150px;
    }
    .grid-toolbar select:focus { outline: none; border-color: var(--accent); }

    .grupo {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
    }
    .grupo-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .grupo-head .n { font-weight: 600; font-size: 13.5px; }
    .grupo-head .c { font-size: 12px; color: var(--muted); }
    .grupo table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .grupo th {
      text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); padding: 8px 12px; background: var(--surface);
      border-bottom: 1px solid var(--border); font-weight: 600;
    }
    .grupo td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .grupo tr:last-child td { border-bottom: none; }
    .grupo td.num, .grupo th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .grupo td.codigo { font-family: var(--font-mono); color: var(--accent); font-size: 11.5px; }
    .grupo td.item-id { font-family: var(--font-mono); color: var(--accent); font-size: 11px; }
    .grupo td.item-id a { color: var(--accent); text-decoration: none; }
    .grupo td.item-id a:hover { text-decoration: underline; }

    .col-l1 { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
    .col-l2 { background: color-mix(in srgb, var(--ok) 4%, var(--surface)); }
    .col-esc { background: color-mix(in srgb, var(--warn) 4%, var(--surface)); }
    .col-tn { background: color-mix(in srgb, #2a6db5 5%, var(--surface)); }

    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
      min-width: 42px; text-align: center;
    }
    .pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
    .pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .pill.hot { background: color-mix(in srgb, var(--hot) 12%, transparent); color: var(--hot); }
    .pill.muted { background: var(--surface-2); color: var(--muted); }

    /* Pill de rentabilidad ML — igual que el original de rosaint.html */
    .rentab-pill {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
      min-width: 42px; text-align: center;
    }
    .rentab-pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
    .rentab-pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .rentab-pill.error { background: color-mix(in srgb, var(--hot) 12%, transparent); color: var(--hot); }
    .rentab-pill.empty { background: var(--surface-2); color: var(--muted); }

    .badge-vinculo {
      display: inline-block; padding: 1px 7px; border-radius: 4px;
      font-size: 10.5px; font-weight: 500; margin-right: 3px;
      white-space: nowrap;
    }
    .badge-vinculo.ancla { background: var(--accent-tint); color: var(--accent); }
    .badge-vinculo.derivado { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
    .badge-vinculo.desvinculado { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }

    .ml-fila-combo td { background: color-mix(in srgb, var(--warn) 4%, transparent); }
    .grupo-head.ml-header-combo { background: color-mix(in srgb, var(--warn) 8%, transparent) !important; }

    .ads-panel { background: var(--surface); }
    .ads-panel summary::-webkit-details-marker { display: none; }
    .ads-panel[open] summary { border-bottom: 1px solid var(--border); }

    .badge {
      font-size: 10px; padding: 1px 6px; border-radius: 10px;
      font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    }
    .badge.cat { background: var(--accent-tint); color: var(--accent); }
    .badge.trad { background: var(--surface-2); color: var(--muted); }
    .badge.cuotas { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .badge.inactiva { background: color-mix(in srgb, var(--hot) 12%, transparent); color: var(--hot); }
    .badge.finalizada { background: var(--surface-2); color: var(--muted); }
    .badge.sku { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); font-family: var(--font-mono); font-size: 10.5px; }
    .badge.sinsku { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .promo-tag { display: inline-block; font-size: 10px; color: var(--warn); margin-left: 4px; }

    /* Divisor de la sección de pausadas (las inactivas van aparte, abajo) */
    .divisor-inactivas {
      display: flex; align-items: center; gap: 12px;
      margin: 28px 0 12px; color: var(--muted);
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    }
    .divisor-inactivas::before, .divisor-inactivas::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .divisor-inactivas ~ .grupo { opacity: .72; }
    .divisor-inactivas.divisor-toggle { cursor: pointer; user-select: none; }
    .divisor-inactivas.divisor-toggle:hover { color: var(--text); }
    .divisor-inactivas .toggle-link { color: var(--accent); font-weight: 600; letter-spacing: 0; text-transform: none; }

    /* ---- Sub-tab Promociones ---- */
    .alerta-promo {
      background: color-mix(in srgb, var(--hot) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--hot) 32%, transparent);
      border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; font-size: 13px;
    }
    .alerta-promo b { color: var(--hot); }
    .alerta-promo div { color: var(--muted); margin-top: 4px; }
    .promo-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
    }
    .promo-card > summary {
      list-style: none; cursor: pointer; user-select: none;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .promo-card > summary::-webkit-details-marker { display: none; }
    .promo-card > summary:hover { background: var(--surface-2); }
    .promo-nombre { font-weight: 600; font-size: 14px; flex: 1; min-width: 180px; }
    .promo-fin { font-size: 12.5px; font-weight: 600; padding: 2px 10px; border-radius: 20px; white-space: nowrap; }
    .promo-fin.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
    .promo-fin.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .promo-fin.hot { background: color-mix(in srgb, var(--hot) 12%, transparent); color: var(--hot); }
    .promo-fin.muted { background: var(--surface-2); color: var(--muted); }
    .promo-cnt { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .promo-tabla { width: 100%; border-collapse: collapse; font-size: 12.5px; border-top: 1px solid var(--border); }
    .promo-tabla th {
      text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); padding: 8px 14px; background: var(--surface-2); font-weight: 600;
    }
    .promo-tabla td { padding: 7px 14px; border-bottom: 1px solid var(--border); }
    .promo-tabla tr:last-child td { border-bottom: none; }
    .promo-tabla td.num, .promo-tabla th.num { text-align: right; font-variant-numeric: tabular-nums; }

    /* ---- Control de descuentos ---- */
    .control-card { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .control-card.bad { background: color-mix(in srgb, var(--hot) 8%, transparent); border-color: color-mix(in srgb, var(--hot) 32%, transparent); }
    .control-card.good { background: color-mix(in srgb, var(--ok) 8%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
    .control-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .control-card.bad h4 { color: var(--hot); }
    .control-card.good h4 { color: var(--ok); }
    .control-tabla { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
    .control-tabla th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 10px; font-weight: 600; }
    .control-tabla td { padding: 6px 10px; border-top: 1px solid var(--border); }
    .control-tabla td.num, .control-tabla th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pct-off { color: var(--hot); font-weight: 700; }
    .pct-ok { color: var(--muted); }
    .control-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); padding: 8px 12px; background: var(--surface-2);
      border-bottom: 1px solid var(--border); font-weight: 600;
    }
    .tbl td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tbl td.mono {
      font-family: var(--font-mono); color: var(--accent); font-size: 11.5px;
    }
    .tbl td.muted { color: var(--muted); font-size: 12.5px; }
    .tbl td.date { white-space: nowrap; color: var(--muted); font-size: 11.5px; }

    /* KPIs (usados en publicaciones + resumen config) */
    .kpi-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px; margin-bottom: 16px;
    }
    .kpi {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px; text-align: center;
    }
    .kpi .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .kpi .l {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin-top: 2px; font-weight: 600;
    }
    .kpi.warn .v { color: var(--warn); }
    .kpi.hot .v { color: var(--hot); }
    .kpi.ok .v { color: var(--ok); }

    /* Alerta de publicaciones perdiendo */
    .alerta-ads {
      background: color-mix(in srgb, var(--hot) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--hot) 32%, transparent);
      border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px;
    }
    .alerta-ads h4 { font-size: 13.5px; font-weight: 600; color: var(--hot); margin-bottom: 4px; }
    .alerta-ads .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .alerta-ads ul { margin: 0; padding-left: 18px; font-size: 12.5px; }
    .alerta-ads li { margin-bottom: 3px; }
    .alerta-ads li b { color: var(--text); }

    /* Motor de publicidad */
    .motor-estado {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: var(--radius-sm);
      font-size: 13.5px; margin-bottom: 14px;
    }
    .motor-estado.on {
      background: color-mix(in srgb, var(--ok) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--ok) 32%, transparent);
      color: var(--ok);
    }
    .motor-estado.off {
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--muted);
    }
    .motor-estado .icon { font-size: 18px; }
    .motor-estado b { color: inherit; }

    .switch-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
      padding: 12px 14px; background: var(--surface-2); border-radius: var(--radius-sm);
    }
    .switch-row input[type=checkbox] {
      width: 20px; height: 20px; cursor: pointer; accent-color: var(--ok);
    }
    .switch-row .lbl { font-weight: 600; }
    .switch-row .desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

    .resultado-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px; margin-bottom: 12px;
    }
    .rmet {
      background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px;
      text-align: center;
    }
    .rmet .v { font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .rmet .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-top: 2px; }
    .rmet.hot .v { color: var(--hot); } .rmet.warn .v { color: var(--warn); }

    .modo-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .modo-badge.real { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
    .modo-badge.seco { background: var(--surface-2); color: var(--muted); }

    .sugerencias {
      background: color-mix(in srgb, var(--ok) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--ok) 25%, transparent);
      border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px;
    }
    .sugerencias b { color: var(--text); }
    .sugerencias ul { margin: 6px 0 0; padding-left: 20px; }
    .sugerencias li { margin-bottom: 4px; }

    .alerta-presu {
      background: color-mix(in srgb, var(--warn) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent);
      color: var(--warn); padding: 10px 14px; border-radius: var(--radius-sm);
      font-size: 13px; margin-bottom: 12px;
    }

    .empty-box {
      padding: 40px 20px; text-align: center; color: var(--muted);
      background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
    }

    .sync-info { font-size: 12px; color: var(--muted); }
    #btnSyncPubs svg { transition: transform .3s; }
    #btnSyncPubs.spin svg { animation: rot 1s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 12px 22px;
      border-radius: var(--radius-sm); font-size: 14px; opacity: 0; pointer-events: none;
      transition: all .25s; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--hot); color: var(--on-accent); }
    .toast.ok { background: var(--ok); color: var(--on-accent); }

    /* Ventas -> Odoo */
    .vo-fila { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
    .vo-fila.cargada { border-style: dashed; opacity: .8; padding: 6px 12px; margin-bottom: 4px; }
    .vo-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .vo-info { font-size: 13px; }
    .vo-acc { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
    .vo-acc .btn { padding: 4px 10px; font-size: 12px; }
    .vo-detalle { margin-top: 8px; }
    .vo-det-box { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
    .vo-linea { padding: 2px 0; font-size: 12.5px; }
  </style>
</head>
<body data-page="canales" data-title="Canales" data-subtitle="Venta Directa · Tienda Nube · Mercado Libre">

<div id="app-shell"></div>

<main id="app-content">

  <div class="canal-tabs">
    <button class="canal-tab active" data-canal="directa">
      <span class="icon">📋</span> Venta Directa
    </button>
    <button class="canal-tab" data-canal="tn">
      <span class="icon">🔵</span> Tienda Nube
    </button>
    <button class="canal-tab" data-canal="ml">
      <span class="icon">🟡</span> Mercado Libre
    </button>
  </div>

  <div id="view-directa"></div>
  <div id="view-tn" style="display:none;"></div>
  <div id="view-ml" style="display:none;"></div>

</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js"></script>
<script src="../shell/shell.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// Canales — Venta Directa / Tienda Nube / Mercado Libre.
// El canal ML incluye Publicaciones y Publicidad como sub-tabs internos.
// ═══════════════════════════════════════════════════════════════════════════

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtARS = n => n == null ? '—' : '$' + Math.round(n).toLocaleString('es-AR');
const fmtPct = n => n == null ? '—' : Number(n).toFixed(0) + '%';
const cleanTitle = t => (t||'').replace(/ - Rosaint.*$/i,'').replace(/Rosaint®?\s*Profesional/i,'').trim();
const urlML = itemId => 'https://articulo.mercadolibre.com.ar/' + itemId.replace(/^MLA/, 'MLA-');

let CANAL_TN = null, MEDIOS = [], PLAZOS = [];
let OBJETIVOS = {}, LINEAS = [];

function classRent(pct, nivel) {
  if (pct == null) return 'muted';
  const obj = OBJETIVOS[nivel];
  if (!obj) return Number(pct) < 0 ? 'hot' : Number(pct) < 20 ? 'warn' : 'ok';
  const verde = obj.objetivo + obj.tolerancia;
  if (Number(pct) >= verde) return 'ok';
  if (Number(pct) >= obj.objetivo) return 'warn';
  return 'hot';
}
function titleRent(pct, nivel) {
  if (pct == null) return 'Sin dato';
  const obj = OBJETIVOS[nivel];
  if (!obj) return `Margen ${Number(pct).toFixed(1)}%`;
  const verde = obj.objetivo + obj.tolerancia;
  return `Margen ${Number(pct).toFixed(1)}% · Objetivo ${obj.objetivo}% · Verde ≥${verde}%`;
}

$$('.canal-tab').forEach(t => t.addEventListener('click', () => {
  $$('.canal-tab').forEach(x => x.classList.toggle('active', x === t));
  const which = t.dataset.canal;
  ['directa','tn','ml'].forEach(v => {
    $('#view-' + v).style.display = (v === which ? '' : 'none');
  });
}));

// Deep-link: canales.html#ml abre directo la pestaña de Mercado Libre (#tn / #directa igual).
(function initCanalDesdeHash() {
  const h = (location.hash || '').replace('#', '');
  if (['directa', 'tn', 'ml'].includes(h)) {
    const tab = document.querySelector(`.canal-tab[data-canal="${h}"]`);
    if (tab) tab.click();
  }
})();

async function cargarComun() {
  const [canales, medios, plazos, objs, lineas] = await Promise.all([
    sb.from('canales_venta').select('*').order('nombre'),
    sb.from('canal_medios_pago').select('*').eq('vigente', true).order('nombre'),
    sb.from('medio_pago_plazos').select('*').order('nombre_plazo'),
    sb.from('objetivos_margen').select('nivel, objetivo_pct, tolerancia_pts'),
    sb.from('lineas').select('id, nombre, orden').order('orden'),
  ]);
  CANAL_TN = (canales.data || []).find(c => /tienda\s*nube/i.test(c.nombre)) || (canales.data || [])[0] || null;
  MEDIOS = medios.data || [];
  PLAZOS = plazos.data || [];
  OBJETIVOS = {};
  for (const o of (objs.data || [])) {
    OBJETIVOS[o.nivel] = { objetivo: Number(o.objetivo_pct), tolerancia: Number(o.tolerancia_pts) };
  }
  LINEAS = lineas.data || [];
}

let toastT;
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

// ═══════════════════════════════════════════════════════════════════════════
// 1) VENTA DIRECTA
// ═══════════════════════════════════════════════════════════════════════════
let SKUS_DIR = [];

async function cargarDirecta() {
  const view = $('#view-directa');
  view.innerHTML = `
    <div class="canal-hint directa">
      <span class="icon">📋</span>
      <div class="txt">
        <b>Venta Directa</b>
        Precios al público (L1 c/IVA) y al profesional (L2 c/IVA) con escalones de descuento por volumen. Se usa en WhatsApp, local y facturación por Odoo.
      </div>
      <div class="actions">
        <a href="../precios/index.html" class="btn ghost">Precios</a>
        <a href="../laboratorio/formulas.html" class="btn ghost">Editar por SKU</a>
      </div>
    </div>

    <details class="config-box">
      <summary>Configuración <span class="sub">— escalones, listas y márgenes viven en el módulo Precios</span></summary>
      <div class="cfg-body">
        <div style="font-size:13px; color:var(--muted); line-height:1.55; margin-bottom:12px;">
          Este canal no tiene comisiones ni medios de pago propios porque la venta es directa (transferencia o efectivo).
        </div>
        <ul style="font-size:13px; color:var(--muted); line-height:1.7; padding-left:20px; margin:0;">
          <li><b>Escalones de descuento por volumen</b> (20%, 30%, 35%) — se aplican sobre L2 según monto del pedido.</li>
          <li><b>Objetivos de margen</b> por lista — definen los semáforos de la grilla.</li>
          <li><b>Precios por SKU</b> — se editan uno por uno desde el editor de fórmulas.</li>
        </ul>
      </div>
    </details>

    <div class="main-section">
      <div class="head">
        <div>
          <h3>Rentabilidad por SKU</h3>
          <div class="sub">Margen bruto sobre venta neta (precio sin IVA). Semáforo según objetivos de margen.</div>
        </div>
      </div>
      <div class="grid-toolbar">
        <div class="search"><input type="text" class="input" id="dir-search" placeholder="Buscar por SKU o nombre…"></div>
        <select id="dir-linea">
          <option value="">Todas las líneas</option>
          ${LINEAS.map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('')}
        </select>
        <span id="dir-cnt" style="font-size:12px; color:var(--muted);">—</span>
      </div>
      <div id="dir-grid"><div class="empty-box">Cargando…</div></div>
    </div>
  `;

  try {
    const { data, error } = await sb.from('v_precios_listas_completos')
      .select('codigo_sku, nombre_sku, linea, categoria, tamanio_kg, costo_unitario, rentab_objetivo_l1, l1_publicado, rentab_real_l1, rentab_objetivo_l2, l2_publicado, rentab_real_l2, l2_menos_20, l2_menos_30, l2_menos_35');
    if (error) throw error;
    SKUS_DIR = data || [];
    renderDirGrid();
    $('#dir-search').addEventListener('input', renderDirGrid);
    $('#dir-linea').addEventListener('change', renderDirGrid);
  } catch (err) {
    $('#dir-grid').innerHTML = `<div class="empty-box" style="color:var(--hot);">Error: ${esc(err.message)}</div>`;
  }
}

function renderDirGrid() {
  const q = $('#dir-search').value.trim().toLowerCase();
  const fLin = $('#dir-linea').value;
  let rows = SKUS_DIR;
  if (q) rows = rows.filter(r => ((r.codigo_sku||'') + ' ' + (r.nombre_sku||'')).toLowerCase().includes(q));
  if (fLin) {
    const lin = LINEAS.find(l => String(l.id) === fLin);
    if (lin) rows = rows.filter(r => r.linea === lin.nombre);
  }
  $('#dir-cnt').textContent = rows.length + ' SKU' + (rows.length !== 1 ? 's' : '');
  if (!rows.length) { $('#dir-grid').innerHTML = '<div class="empty-box">Sin resultados</div>'; return; }

  const grupos = LINEAS.map(l => ({
    nombre: l.nombre,
    rows: rows.filter(r => r.linea === l.nombre).sort((a,b) => (a.codigo_sku||'').localeCompare(b.codigo_sku||'')),
  })).filter(g => g.rows.length > 0);
  const enGrupo = new Set(grupos.flatMap(g => g.rows.map(r => r.codigo_sku)));
  const sinLinea = rows.filter(r => !enGrupo.has(r.codigo_sku));
  if (sinLinea.length) grupos.push({ nombre: 'Sin línea', rows: sinLinea });

  $('#dir-grid').innerHTML = grupos.map(g => `
    <div class="grupo">
      <div class="grupo-head"><div class="n">${esc(g.nombre)}</div><div class="c">${g.rows.length} SKU${g.rows.length !== 1 ? 's' : ''}</div></div>
      <table>
        <thead><tr>
          <th>Código</th><th>Nombre</th><th class="num">Tam.</th><th class="num">Costo</th>
          <th class="num col-l1">L1 c/IVA</th><th class="num col-l1">Rent L1</th>
          <th class="num col-l2">L2 c/IVA</th><th class="num col-l2">Rent L2</th>
          <th class="num col-esc">L2 −20%</th><th class="num col-esc">L2 −30%</th><th class="num col-esc">L2 −35%</th>
        </tr></thead>
        <tbody>
          ${g.rows.map(r => `
            <tr>
              <td class="codigo">${esc(r.codigo_sku)}</td>
              <td>${esc(r.nombre_sku || '—')}</td>
              <td class="num" style="color:var(--muted);">${r.tamanio_kg != null ? Number(r.tamanio_kg) + 'Kg' : '—'}</td>
              <td class="num" style="color:var(--muted);">${fmtARS(r.costo_unitario)}</td>
              <td class="num col-l1">${fmtARS(r.l1_publicado)}</td>
              <td class="num col-l1"><span class="pill ${classRent(r.rentab_real_l1,'L1')}" title="${titleRent(r.rentab_real_l1,'L1')}">${fmtPct(r.rentab_real_l1)}</span></td>
              <td class="num col-l2">${fmtARS(r.l2_publicado)}</td>
              <td class="num col-l2"><span class="pill ${classRent(r.rentab_real_l2,'L2')}" title="${titleRent(r.rentab_real_l2,'L2')}">${fmtPct(r.rentab_real_l2)}</span></td>
              <td class="num col-esc">${fmtARS(r.l2_menos_20)}</td>
              <td class="num col-esc">${fmtARS(r.l2_menos_30)}</td>
              <td class="num col-esc">${fmtARS(r.l2_menos_35)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`).join('');
}

// ═══════════════════════════════════════════════════════════════════════════
// 2) TIENDA NUBE
// ═══════════════════════════════════════════════════════════════════════════
let RENT_TN = [];

async function cargarTN() {
  if (!CANAL_TN) { $('#view-tn').innerHTML = '<div class="empty-box">No hay canal Tienda Nube configurado.</div>'; return; }
  const c = CANAL_TN;
  $('#view-tn').innerHTML = `
    <div class="canal-hint tn">
      <span class="icon">🔵</span>
      <div class="txt">
        <b>Tienda Nube</b>
        Marketplace B2C. Precio en pesos calculado desde L1 × factor. Comisión de plataforma, IIBB, envío absorbido y descuentos por medio de pago.
      </div>
    </div>

    <details class="config-box">
      <summary>Configuración del canal <span class="sub">— factor, redondeo, comisiones, IIBB, envío</span></summary>
      <div class="cfg-body">
        <div class="field-grid">
          <div class="field"><label>Factor sobre L1</label><input type="number" id="tn-factor" step="0.01" min="1" value="${c.factor_lista ?? ''}"><div class="help">Ej: 1,20 = +20% sobre L1 c/IVA.</div></div>
          <div class="field"><label>Redondeo ($)</label><input type="number" id="tn-redondeo" step="10" min="1" value="${c.redondeo ?? ''}"><div class="help">Ej: 100 = múltiplos de $100.</div></div>
          <div class="field"><label>Descuento por transferencia (%)</label><input type="number" id="tn-transf" step="0.5" min="0" value="${c.descuento_transf_pct ?? ''}"></div>
          <div class="field"><label>Comisión plataforma (%)</label><input type="number" id="tn-plataforma" step="0.1" min="0" value="${c.comision_plataforma_pct ?? ''}"><div class="help">Ej: TN 2%.</div></div>
          <div class="field"><label>IIBB (%)</label><input type="number" id="tn-iibb" step="0.1" min="0" value="${c.iibb_pct ?? ''}"></div>
          <div class="field"><label>Envío promedio absorbido ($)</label><input type="number" id="tn-envio" step="10" min="0" value="${c.envio_promedio ?? ''}"></div>
        </div>
        <div class="save-row"><span class="spacer"></span><span class="status" id="tn-status"></span><button class="btn primary" id="tn-save">Guardar configuración</button></div>
      </div>
    </details>

    <details class="config-box">
      <summary>Medios de pago y plazos <span class="sub">— comisiones, financiación 3 cuotas, plazo activo</span></summary>
      <div class="cfg-body">
        <div id="tn-medios"></div>
        <div class="save-row"><span class="spacer"></span><span class="status" id="tn-medios-status"></span><button class="btn primary" id="tn-medios-save">Guardar medios</button></div>
      </div>
    </details>

    <div class="main-section">
      <div class="head"><div><h3>Rentabilidad por SKU × medio de pago</h3><div class="sub">Precio y margen con transferencia, 1 pago y 3 cuotas.</div></div></div>
      <div class="grid-toolbar">
        <div class="search"><input type="text" class="input" id="tn-search" placeholder="Buscar por SKU o nombre…"></div>
        <select id="tn-medio"><option value="">Todos los medios</option></select>
        <span id="tn-cnt" style="font-size:12px; color:var(--muted);">—</span>
      </div>
      <div id="tn-grid"><div class="empty-box">Cargando…</div></div>
    </div>
  `;
  renderMedios();
  await cargarGrillaTN();
  $('#tn-save').addEventListener('click', guardarCfgTN);
  $('#tn-medios-save').addEventListener('click', guardarMedios);
  $('#tn-search').addEventListener('input', renderGrillaTN);
  $('#tn-medio').addEventListener('change', renderGrillaTN);
}

function renderMedios() {
  $('#tn-medios').innerHTML = MEDIOS.map(m => {
    const plazos = PLAZOS.filter(p => p.medio_pago_id === m.id);
    return `
      <div class="medio-card" data-medio="${m.id}">
        <h4>💳 ${esc(m.nombre)}</h4>
        <div class="field-grid" style="margin-bottom:10px;">
          <div class="field"><label>Financiación 3 cuotas (%)</label><input type="number" step="0.01" min="0" class="medio-cuotas" value="${m.financiacion_cuotas_pct ?? 0}"></div>
          <div class="field" style="display:flex; align-items:flex-end;"><label style="display:flex; align-items:center; gap:6px; margin:0 0 8px 0; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:500; color:var(--text); font-size:13px;"><input type="checkbox" class="medio-exime" ${m.exime_comision_plataforma ? 'checked' : ''} style="width:auto; margin:0;"> Exime comisión de plataforma</label></div>
        </div>
        <div style="font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; margin-bottom:6px;">Plazos disponibles</div>
        ${plazos.length ? plazos.map(p => `
          <div class="plazo-row" data-plazo="${p.id}">
            <label><input type="radio" name="plazo-${m.id}" value="${p.id}" ${p.plazo_activo ? 'checked' : ''}><span>${esc(p.nombre_plazo)}</span></label>
            <input type="number" step="0.01" min="0" class="plazo-pct inline-edit" value="${p.comision_pct ?? 0}" title="% por cobro">
            <span style="font-size:11.5px; color:var(--muted);">% por cobro</span>
          </div>`).join('') : '<div style="font-size:12px; color:var(--muted);">Sin plazos.</div>'}
      </div>`;
  }).join('');
}

async function guardarCfgTN() {
  const btn = $('#tn-save'); btn.disabled = true;
  const st = $('#tn-status'); st.textContent = 'Guardando…'; st.className = 'status';
  try {
    const upd = {
      factor_lista: parseFloat($('#tn-factor').value) || 0,
      redondeo: parseInt($('#tn-redondeo').value, 10) || 1,
      descuento_transf_pct: parseFloat($('#tn-transf').value) || 0,
      comision_plataforma_pct: parseFloat($('#tn-plataforma').value) || 0,
      iibb_pct: parseFloat($('#tn-iibb').value) || 0,
      envio_promedio: parseFloat($('#tn-envio').value) || 0,
      actualizado_en: new Date().toISOString(),
    };
    const { error } = await sb.from('canales_venta').update(upd).eq('id', CANAL_TN.id);
    if (error) throw error;
    st.textContent = '✓ Guardado'; st.className = 'status ok';
    await cargarComun(); await cargarGrillaTN();
    toast('Tienda Nube guardada', 'ok');
  } catch (err) { st.textContent = '✗ ' + err.message; st.className = 'status err'; toast('Error: ' + err.message, 'err'); }
  finally { btn.disabled = false; }
}

async function guardarMedios() {
  const btn = $('#tn-medios-save'); btn.disabled = true;
  const st = $('#tn-medios-status'); st.textContent = 'Guardando…'; st.className = 'status';
  try {
    for (const b of $$('#tn-medios .medio-card')) {
      const medioId = parseInt(b.dataset.medio, 10);
      const cuotas = parseFloat(b.querySelector('.medio-cuotas').value) || 0;
      const exime = b.querySelector('.medio-exime').checked;
      const { error: eM } = await sb.from('canal_medios_pago').update({ financiacion_cuotas_pct: cuotas, exime_comision_plataforma: exime, actualizado_en: new Date().toISOString() }).eq('id', medioId);
      if (eM) throw new Error('Medio: ' + eM.message);
      for (const inp of b.querySelectorAll('.plazo-pct')) {
        const plazoId = parseInt(inp.closest('.plazo-row').dataset.plazo, 10);
        const { error: eP } = await sb.from('medio_pago_plazos').update({ comision_pct: parseFloat(inp.value) || 0, actualizado_en: new Date().toISOString() }).eq('id', plazoId);
        if (eP) throw new Error('Plazo: ' + eP.message);
      }
      const activo = b.querySelector(`input[name="plazo-${medioId}"]:checked`);
      if (activo) {
        await sb.from('medio_pago_plazos').update({ plazo_activo: false }).eq('medio_pago_id', medioId);
        const { error: eA } = await sb.from('medio_pago_plazos').update({ plazo_activo: true }).eq('id', parseInt(activo.value, 10));
        if (eA) throw new Error('Plazo activo: ' + eA.message);
      }
    }
    await cargarComun(); renderMedios(); await cargarGrillaTN();
    st.textContent = '✓ Guardado'; st.className = 'status ok';
    toast('Medios guardados', 'ok');
  } catch (err) { st.textContent = '✗ ' + err.message; st.className = 'status err'; toast('Error: ' + err.message, 'err'); }
  finally { btn.disabled = false; }
}

async function cargarGrillaTN() {
  try {
    const { data, error } = await sb.from('v_rentabilidad_canal').select('*').eq('canal_id', CANAL_TN.id);
    if (error) throw error;
    RENT_TN = data || [];
    const mediosUnicos = [...new Map(RENT_TN.map(r => [r.medio_pago_id, r])).values()];
    const sel = $('#tn-medio');
    sel.innerHTML = '<option value="">Todos los medios</option>' + mediosUnicos.map(m =>
      `<option value="${m.medio_pago_id}" ${m.es_default ? 'selected' : ''}>💳 ${esc(m.medio_pago)}${m.es_default ? ' ★' : ''}</option>`
    ).join('');
    renderGrillaTN();
  } catch (err) {
    $('#tn-grid').innerHTML = `<div class="empty-box" style="color:var(--hot);">Error: ${esc(err.message)}</div>`;
  }
}

function renderGrillaTN() {
  const q = $('#tn-search').value.trim().toLowerCase();
  const fMedio = $('#tn-medio').value;
  let rows = RENT_TN.slice();
  if (fMedio) rows = rows.filter(r => String(r.medio_pago_id) === fMedio);
  if (q) rows = rows.filter(r => ((r.codigo||'') + ' ' + (r.producto||'')).toLowerCase().includes(q));
  $('#tn-cnt').textContent = rows.length + ' fila' + (rows.length !== 1 ? 's' : '');
  if (!rows.length) { $('#tn-grid').innerHTML = '<div class="empty-box">Sin resultados</div>'; return; }

  const grupos = LINEAS.map(l => ({ nombre: l.nombre, rows: rows.filter(r => r.linea === l.nombre).sort((a,b) => (a.codigo||'').localeCompare(b.codigo||'')) })).filter(g => g.rows.length > 0);
  const enGrupo = new Set(grupos.flatMap(g => g.rows.map(r => r.codigo)));
  const sinLinea = rows.filter(r => !enGrupo.has(r.codigo));
  if (sinLinea.length) grupos.push({ nombre: 'Otros', rows: sinLinea });

  $('#tn-grid').innerHTML = grupos.map(g => `
    <div class="grupo">
      <div class="grupo-head"><div class="n">${esc(g.nombre)}</div><div class="c">${g.rows.length} SKU · ${esc(g.rows[0]?.medio_pago || '')}</div></div>
      <table>
        <thead><tr>
          <th>Código</th><th>Nombre</th><th class="num">L1 c/IVA</th>
          <th class="num col-tn">Lista</th><th class="num col-tn">Transf.</th><th class="num">Rent Transf.</th>
          <th class="num col-tn">1 pago</th><th class="num">Rent 1 pago</th><th class="num">Rent 3 cuotas</th>
        </tr></thead>
        <tbody>
          ${g.rows.map(r => `
            <tr>
              <td class="codigo">${esc(r.codigo)}</td><td>${esc(r.producto || '—')}</td>
              <td class="num" style="color:var(--muted);">${fmtARS(r.l1_iva_incl)}</td>

// ─────── SUB-TAB VENTAS → ODOO ───────
// Revisar las ventas de ML (por pack, desde 01/09) y cargarlas en Odoo como borrador.
// Usa la edge function ml-odoo-cargar (modos listar/preview/cargar). Ver memoria rosaint-ml-odoo-conector.
let VENTAS_ODOO_CARGADO = false;
const fFechaHora = f => f ? new Date(f).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';

async function cargarVentasOdoo() {
  VENTAS_ODOO_CARGADO = true;
  const el = $('#sub-odoo');
  el.innerHTML = '<div class="empty-box">Consultando ventas de Mercado Libre…</div>';
  try {
    const { data: j, error } = await sb.functions.invoke('ml-odoo-cargar', { body: { modo: 'listar' } });
    if (error) throw new Error(error.message);

    el.innerHTML = '<div class="empty-box" style="color:var(--hot)">No se pudo consultar: ' + esc(err.message) + '</div>';

}

function renderVentasOdoo(j) {
  const packs = (j.packs || []).slice().sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  const pend = packs.filter(p => !p.ya_cargada);
  const cargadas = packs.filter(p => p.ya_cargada);
  const filaPend = (p) => `
    <div class="vo-fila" data-order="${esc(p.order_id)}" data-pack="${esc(p.pack_id)}">
      <div class="vo-cab">
        <span class="vo-info">${fFechaHora(p.fecha)} · <b>${esc(p.comprador || '—')}</b> · ${fmtARS(p.total)} · ${p.items} ${p.items === 1 ? 'ítem' : 'ítems'}</span>
        <span class="vo-acc">
          <button class="btn secondary vo-ver" onclick="verVentaOdoo('${esc(p.order_id)}', this)">👁 Ver</button>
          <button class="btn primary vo-cargar" onclick="cargarVentaOdoo('${esc(p.order_id)}', this)">Cargar borrador</button>
        </span>
      </div>
      <div class="vo-detalle" style="display:none;"></div>
    </div>`;
  const filaCargada = (p) => `
    <div class="vo-fila cargada">
      <div class="vo-cab">
        <span class="vo-info" style="color:var(--muted)">${fFechaHora(p.fecha)} · ${esc(p.comprador || '—')} · ${fmtARS(p.total)}</span>
        <span class="vo-acc" style="color:var(--ok); font-size:12px;">✓ ${esc(p.so_name)}</span>
      </div>
    </div>`;
  $('#sub-odoo').innerHTML = `
    <div class="main-section">
      <div class="head">
        <div>
          <h3>🧾 Ventas de Mercado Libre → Odoo</h3>
          <div class="sub">Desde el ${esc(j.corte)}. Se cargan como <b>borrador</b> (presupuesto) en VELAZQUEZ. Una venta = un pack; cliente por datos de facturación; combos y Flex incluidos.</div>
        </div>
        <button class="btn secondary" onclick="cargarVentasOdoo()">↻ Actualizar</button>
      </div>
      <div style="display:flex; gap:10px; align-items:center; margin:10px 0; flex-wrap:wrap;">
        <span class="badge-vinculo" style="background:var(--accent-tint); color:var(--accent); font-weight:600;">${pend.length} pendiente${pend.length === 1 ? '' : 's'}</span>
        <span style="color:var(--muted); font-size:12px;">${cargadas.length} ya cargada${cargadas.length === 1 ? '' : 's'}</span>
        ${pend.length ? `<button class="btn primary" style="margin-left:auto;" onclick="cargarTodasVentasOdoo(this)">Cargar todas (${pend.length})</button>` : ''}
      </div>
      <div id="vo-pend">
        ${pend.length ? pend.map(filaPend).join('') : '<div class="empty-box" style="color:var(--ok)">✓ No hay ventas pendientes de cargar.</div>'}
      </div>
      ${cargadas.length ? `<details style="margin-top:14px;"><summary style="cursor:pointer; color:var(--muted); font-size:13px;">Ver ${cargadas.length} ya cargadas</summary><div style="margin-top:8px;">${cargadas.map(filaCargada).join('')}</div></details>` : ''}
    </div>`;
}

async function verVentaOdoo(orderId, btn) {
  const fila = btn.closest('.vo-fila');
  const det = fila.querySelector('.vo-detalle');
  if (det.style.display !== 'none') { det.style.display = 'none'; return; }
  det.style.display = '';
  det.innerHTML = '<div style="padding:8px; color:var(--muted); font-size:12.5px;">Cargando detalle…</div>';
  try {
    const { data: j, error } = await sb.functions.invoke('ml-odoo-cargar', { body: { modo: 'preview', order_id: orderId } });
    if (error) throw new Error(error.message);
    if (!j || j.ok === false) throw new Error((j && j.error) || 'Error');
    const c = j.cliente || {};
    const lineas = (j.lineas || []).map(l => `<div class="vo-linea">${l.qty} × <b>${esc((l.titulo || '').replace(/ - Rosaint.*$/i, ''))}</b> <span style="color:var(--muted)">(SKU ${esc(l.sku)})</span> · ${fmtARS(l.precio)}${l.product_id ? '' : ' <span style="color:var(--hot)">⚠ sin producto en Odoo</span>'}</div>`).join('');
    const warn = (j.warnings || []).length ? `<div style="color:var(--hot); font-size:12px; margin-top:6px;">⚠ ${j.warnings.map(esc).join('<br>⚠ ')}</div>` : '';
    det.innerHTML = `
      <div class="vo-det-box">
        <div><b>Cliente:</b> ${esc(c.nombre)} · ${esc(c.tipo_doc)} ${esc(c.documento)} · ${esc(c.condicion_afip)} ${j.cliente_existe ? '<span style="color:var(--ok)">(ya existe)</span>' : '<span style="color:var(--accent)">(nuevo)</span>'}</div>
        <div style="color:var(--muted); font-size:12.5px;">${esc(c.localidad)} · ${esc(c.provincia_nombre)} · CP ${esc(c.cp)}${j.flex ? ' · <b style="color:#128C7E">🛵 FLEX</b>' : ''}</div>
        <div style="margin-top:6px;">${lineas}</div>
        <div style="margin-top:6px;"><b>Total: ${fmtARS(j.total)}</b></div>
        ${warn}
      </div>`;
  } catch (err) { det.innerHTML = '<div style="color:var(--hot); padding:8px;">Error: ' + esc(err.message) + '</div>'; }
}

async function cargarVentaOdoo(orderId, btn) {
  const prev = btn.textContent; btn.disabled = true; btn.textContent = '⏳ Cargando…';
  try {
    const { data: j, error } = await sb.functions.invoke('ml-odoo-cargar', { body: { modo: 'cargar', order_id: orderId } });
    if (error) throw new Error(error.message);
    if (!j || j.ok === false) throw new Error((j && j.error) || 'Error');
    if (j.ya_cargada) { toast('Ya estaba cargada: ' + j.so_id, 'warn'); }
    else { toast('✓ ' + (j.so_name || 'Cargada') + ' · ' + fmtARS(j.total_odoo) + (j.total_coincide ? '' : ' ⚠ total no coincide'), 'ok'); }
    cargarVentasOdoo();
  } catch (err) { toast('Error: ' + err.message, 'err'); btn.disabled = false; btn.textContent = prev; }
}

async function cargarTodasVentasOdoo(btn) {
  const filas = $$('#vo-pend .vo-fila');
  if (!filas.length) return;
  if (!confirm('¿Cargar las ' + filas.length + ' ventas pendientes como borrador en Odoo?')) return;
  btn.disabled = true; const prev = btn.textContent;
  let ok = 0, err = 0;
  for (let i = 0; i < filas.length; i++) {
    const orderId = filas[i].dataset.order;
    btn.textContent = `⏳ ${i + 1}/${filas.length}…`;
    try {
      const { data: j } = await sb.functions.invoke('ml-odoo-cargar', { body: { modo: 'cargar', order_id: orderId } });
      if (j && j.ok) ok++; else err++;
    } catch { err++; }
  }
  toast(`Cargadas ${ok}${err ? ' · ' + err + ' con error' : ''}`, err ? 'warn' : 'ok');
  cargarVentasOdoo();
}

// ─────── SUB-TAB PROMOCIONES ───────
// Campañas de promoción de ML (DEAL / SMART) con fecha de fin. Semáforo por días
// restantes. Datos en ml_promos / v_promo_items (edge function ml-promos-sync).
let PROMOS = [], PROMO_ITEMS = [], CTRL_REGLAS = {}, CTRL_PUBS = [];
const fFecha = f => f ? new Date(f).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) : '—';
// Tamaño del producto según el título (para saber qué regla de descuento aplica).
function tamanoDe(titulo) {
  const t = (titulo || '').toLowerCase();
  if (/combo/.test(t)) return /crema/.test(t) ? 'combo-crema' : 'combo-gel';
  if (/10\s?kg/.test(t)) return '10kg';
  if (/4\s?kg/.test(t)) return '4kg';
  if (/1\s?kg/.test(t)) return '1kg';
  if (/500\s?g/.test(t)) return '500g';
  return null;
}
const diasHasta = f => f == null ? null : Math.ceil((new Date(f).getTime() - Date.now()) / 86400000);
function claseFin(dias) {
  if (dias == null) return 'muted';
  if (dias <= 3) return 'hot';
  if (dias <= 7) return 'warn';
  return 'ok';
}

async function cargarPromociones() {
  $('#sub-promos').innerHTML = `
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
      <span class="sync-info" id="promo-sync-info">—</span>
      <span style="flex:1;"></span>
      <button class="btn primary" id="btnSyncPromos">Sincronizar promociones</button>
    </div>
    <div id="promo-control"></div>
    <div id="promo-alert"></div>
    <div id="promo-content"><div class="empty-box">Cargando…</div></div>
  `;
  try {
    const [pr, it, rg, pubs] = await Promise.all([
      sb.from('ml_promos').select('*'),
      sb.from('v_promo_items').select('*'),
      sb.from('ml_reglas_descuento').select('*'),
      sb.from('v_rentabilidad_ml').select('item_id,titulo,activa,precio,precio_con_descuento,precio_meli'),
    ]);
    if (pr.error) throw pr.error;
    PROMOS = pr.data || [];
    PROMO_ITEMS = it.data || [];
    CTRL_REGLAS = {}; (rg.data || []).forEach(r => { CTRL_REGLAS[r.tamano] = r; });
    CTRL_PUBS = pubs.data || [];
    renderControlDescuentos();
    renderPromos();
    $('#btnSyncPromos').addEventListener('click', sincronizarPromos);
  } catch (err) {
    $('#promo-content').innerHTML = `<div class="empty-box" style="color:var(--hot);">Error: ${esc(err.message)}</div>`;
  }
}

// % exacto sin redondear (2 decimales, formato es-AR, sin ceros de más).
const pctTxt = n => (n == null) ? '—' : (+Number(n).toFixed(2)).toLocaleString('es-AR') + '%';

// Control: muestra el panorama de TODAS las publicaciones en promo con su descuento
// real (general y Meli+, exacto) y marca las que SUPERAN el tope Meli+ costeado por
// tamaño. Distingue DEAL (vos elegís) de SMART/oferta compartida (ML gestiona).
// Combos: dos familias — combo-gel (30/35) y combo-crema (35/40).
function renderControlDescuentos() {
  const cont = $('#promo-control');
  if (!cont) return;

  const enPromo = CTRL_PUBS.filter(p => p.activa && p.precio_con_descuento != null && Number(p.precio) > 0);

  // Tipos de promo activa por item.
  const tiposPorItem = {};
  for (const pi of PROMO_ITEMS) {
    const promo = PROMOS.find(pr => pr.id === pi.promo_id && pr.estado === 'started');
    if (!promo) continue;
    (tiposPorItem[pi.item_id] = tiposPorItem[pi.item_id] || new Set()).add(promo.tipo);
  }

  const rows = [];
  let excede = 0, sinRegla = 0, haySmart = false;
  for (const p of enPromo) {
    const tam = tamanoDe(p.titulo);
    const regla = tam ? CTRL_REGLAS[tam] : null;
    if (!regla) sinRegla++;
    const tope = regla ? Number(regla.desc_meli_pct) : null;
    const gen = 100 * (Number(p.precio) - Number(p.precio_con_descuento)) / Number(p.precio);
    const meli = p.precio_meli != null ? 100 * (Number(p.precio) - Number(p.precio_meli)) / Number(p.precio) : null;
    const genExc = tope != null && gen > tope + 0.001;
    const meliExc = tope != null && meli != null && meli > tope + 0.001;
    if (genExc || meliExc) excede++;
    const tipos = tiposPorItem[p.item_id] ? Array.from(tiposPorItem[p.item_id]) : [];
    if (tipos.includes('SMART')) haySmart = true;
    rows.push({ titulo: p.titulo, etq: regla ? regla.etiqueta : '—', tope, gen, meli, genExc, meliExc, tipos });
  }
  // Los que superan el tope, primero.
  rows.sort((a, b) => (((b.genExc || b.meliExc) ? 1 : 0) - ((a.genExc || a.meliExc) ? 1 : 0)));

  const tipoBadges = tipos => tipos.map(t => t === 'SMART'
    ? '<span class="badge cuotas" title="Oferta compartida: ML gestiona y co-financia el descuento; no fijás general/Meli+ por separado">SMART</span>'
    : '<span class="badge cat" title="Oferta donde vos elegís el descuento">DEAL</span>').join(' ') || '<span class="pct-ok">—</span>';

  const filas = rows.map(r => `
    <tr>
      <td>${esc(cleanTitle(r.titulo))}</td>
      <td>${esc(r.etq)}</td>
      <td class="num ${r.genExc ? 'pct-off' : ''}">${pctTxt(r.gen)}</td>
      <td class="num ${r.meliExc ? 'pct-off' : ''}">${pctTxt(r.meli)}</td>
      <td class="num pct-ok">${r.tope != null ? pctTxt(r.tope) : '—'}</td>
      <td>${tipoBadges(r.tipos)}</td>
    </tr>`).join('');

  const clase = excede ? 'bad' : 'good';
  const titulo = excede
    ? `⚠ ${excede} publicación${excede !== 1 ? 'es' : ''} supera${excede !== 1 ? 'n' : ''} el tope de Meli+`
    : '✓ Ningún descuento supera el tope de Meli+';
  const notas = [];
  if (haySmart) notas.push('Las <b>SMART</b> son ofertas compartidas: ML gestiona el descuento (y co-financia parte); no podés fijar general/Meli+ por separado.');
  if (sinRegla) notas.push(`${sinRegla} sin regla por tamaño (revisar el título).`);

  cont.innerHTML = `
    <div class="control-card ${clase}">
      <h4>${titulo}</h4>
      <div style="font-size:12.5px; color:var(--muted);">Regla: el descuento nunca debe superar el tope Meli+ costeado por tamaño. Porcentajes exactos.</div>
      <table class="control-tabla">
        <thead><tr><th>Producto</th><th>Tamaño</th><th class="num">General</th><th class="num">Meli+</th><th class="num">Tope</th><th>Promo</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
      ${notas.length ? `<div class="control-note">${notas.join(' ')}</div>` : ''}
    </div>`;
}

function renderPromos() {
  const fechas = PROMOS.map(p => p.sincronizado_en).filter(Boolean).sort();
  $('#promo-sync-info').textContent = fechas.length
    ? `${PROMOS.length} promociones · sincronizado ${fFecha(fechas[fechas.length-1])} ${new Date(fechas[fechas.length-1]).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`
    : `${PROMOS.length} promociones`;

  if (!PROMOS.length) {
    $('#promo-alert').innerHTML = '';
    $('#promo-content').innerHTML = '<div class="empty-box">No hay promociones cargadas. Tocá "Sincronizar promociones".</div>';
    return;
  }

  const activas = PROMOS.filter(p => p.estado === 'started')
    .sort((a,b) => new Date(a.finish_date||0) - new Date(b.finish_date||0));
  const proximas = PROMOS.filter(p => p.estado !== 'started')
    .sort((a,b) => new Date(a.start_date||0) - new Date(b.start_date||0));

  const porTerminar = activas.filter(p => { const d = diasHasta(p.finish_date); return d != null && d <= 3; });
  $('#promo-alert').innerHTML = porTerminar.length ? `
    <div class="alerta-promo">
      <b>⚠ ${porTerminar.length} promoción${porTerminar.length>1?'es':''} termina${porTerminar.length>1?'n':''} en ≤3 días</b>
      <div>${porTerminar.map(p => esc(p.nombre || p.id)).join(' · ')} — revisá si querés renovarlas o reacomodar precios antes de que caigan.</div>
    </div>` : '';

  let html = `<div class="divisor-inactivas" style="margin-top:2px;">Activas · ${activas.length}</div>`;
  html += activas.length ? activas.map(renderPromoCard).join('') : '<div class="empty-box">Ninguna activa.</div>';
  if (proximas.length) {
    html += `<div class="divisor-inactivas">Próximas · ${proximas.length}</div>`;
    html += proximas.map(renderPromoCard).join('');
  }
  $('#promo-content').innerHTML = html;
}

function renderPromoCard(p) {
  const items = PROMO_ITEMS.filter(x => x.promo_id === p.id);
  const esProxima = p.estado !== 'started';
  const dias = diasHasta(esProxima ? p.start_date : p.finish_date);
  let finTxt;
  if (esProxima) {
    finTxt = `Arranca ${fFecha(p.start_date)}${dias!=null ? ` · en ${dias} día${dias!==1?'s':''}` : ''}`;
  } else {
    const cuando = dias == null ? '' : (dias <= 0 ? ' · termina hoy' : ` · en ${dias} día${dias!==1?'s':''}`);
    finTxt = `Termina ${fFecha(p.finish_date)}${cuando}`;
  }
  const finCls = esProxima ? 'muted' : claseFin(dias);
  const tipoBadge = p.tipo === 'SMART'
    ? '<span class="badge cuotas" title="Promoción inteligente gestionada por ML (ML pone parte del descuento)">SMART</span>'
    : '<span class="badge cat" title="Oferta/campaña donde elegís entrar por producto">DEAL</span>';

  const filas = items
    .slice().sort((a,b) => Number(a.price||0) - Number(b.price||0))
    .map(it => `
      <tr>
        <td>${esc(cleanTitle(it.titulo || it.item_id))}${!it.activa ? ' <span class="badge inactiva">pausada</span>' : ''}</td>
        <td class="num" style="color:var(--muted); text-decoration:line-through;">${it.original_price!=null?fmtARS(Number(it.original_price)):'—'}</td>
        <td class="num" style="color:var(--accent); font-weight:600;">${it.price!=null?fmtARS(Number(it.price)):'—'}</td>
      </tr>`).join('');

  return `
    <details class="promo-card">
      <summary>
        <span class="promo-nombre">${esc(p.nombre || p.id)} ${tipoBadge}</span>
        <span class="promo-fin ${finCls}">${finTxt}</span>
        <span class="promo-cnt">${items.length} prod.</span>
      </summary>
      <div class="promo-body">
        ${items.length
          ? `<table class="promo-tabla"><thead><tr><th>Producto</th><th class="num">Lista</th><th class="num">En promo</th></tr></thead><tbody>${filas}</tbody></table>`
          : '<div style="padding:10px 14px; color:var(--muted); font-size:12.5px;">Sin productos listados.</div>'}
      </div>
    </details>`;
}

async function sincronizarPromos() {
  const btn = $('#btnSyncPromos'); const prev = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sincronizando…';
  try {
    const { data, error } = await sb.functions.invoke('ml-promos-sync', { body: {} });
    if (error) throw new Error(error.message);
    if (data && data.ok === false) throw new Error(data.error || 'Error');
    toast(`✓ ${data.promos} promociones · ${data.items} productos`, 'ok');
    await cargarPromociones();
  } catch (err) {
    toast('Error: ' + err.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = prev;
  }
}

// ─────── 3.1) SUB-TAB PUBLICACIONES ───────
async function cargarPublicaciones() {
  $('#sub-pubs').innerHTML = `
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
      <span class="sync-info" id="sync-info">—</span>
      <span style="flex:1;"></span>
      <button class="btn secondary" id="btnSyncAds">Sincronizar gasto ADS</button>
      <button class="btn primary" id="btnSyncPubs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
        Sincronizar con ML
      </button>
    </div>

    <div class="grid-toolbar">
      <div class="search"><input type="text" class="input" id="pub-search" placeholder="Buscar por título, item ID o SKU…"></div>
      <select id="pub-tipo">
        <option value="">Todos los tipos</option>
        <option value="catalogo">Solo catálogo</option>
        <option value="tradicional">Solo tradicional</option>
      </select>
      <select id="pub-cuotas">
        <option value="">Con y sin cuotas</option>
        <option value="con">Con cuotas</option>
        <option value="sin">Sin cuotas</option>
      </select>
      <select id="pub-act">
        <option value="">Todas</option>
        <option value="activa">Solo activas</option>
        <option value="pausada">Solo pausadas</option>
        <option value="finalizada">Solo finalizadas</option>
      </select>
    </div>

    <div id="panel-ads-ml"></div>
    <div id="pub-content"><div class="empty-box">Cargando…</div></div>
  `;

  try {
    const { data, error } = await sb.from('v_rentabilidad_ml').select('*');
    if (error) throw error;
    PUBS = data || [];
    actualizarSyncInfo(PUBS.length);
    renderPubs();
    $('#pub-search').addEventListener('input', renderPubs);
    $('#pub-tipo').addEventListener('change', renderPubs);
    $('#pub-cuotas').addEventListener('change', renderPubs);
    $('#pub-act').addEventListener('change', renderPubs);
    $('#btnSyncPubs').addEventListener('click', sincronizarPubs);
    $('#btnSyncAds').addEventListener('click', sincronizarAdsGasto);
