<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteo de inventario · Rosaint CORE</title>
  <meta name="app-root" content="../">
  <link rel="icon" type="image/svg+xml" href="../shell/logo.svg">
  <link rel="stylesheet" href="../shell/shell.css">
  <style>
    .cn-top { display:flex; gap:14px; align-items:stretch; flex-wrap:wrap; margin-bottom:16px; }
    .cn-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; flex:1; min-width:280px; }
    .cn-kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
    .cn-kpi .k { font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
    .cn-kpi .v { font-size:23px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums; }
    .cn-kpi .sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
    .barra { height:7px; background:var(--bg); border-radius:99px; overflow:hidden; margin-top:8px; }
    .barra > i { display:block; height:100%; background:var(--ok); border-radius:99px; }
    .cn-acc { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; min-width:240px; max-width:320px; display:flex; flex-direction:column; gap:8px; }
    .cn-acc .txt { font-size:11.5px; color:var(--muted); line-height:1.45; }
    .guardado { font-size:12px; font-weight:600; padding:4px 10px; border-radius:99px; align-self:flex-start; }
    .guardado.ok { color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent); }
    .guardado.pend { color:var(--warn); background:color-mix(in srgb, var(--warn) 13%, transparent); }
    .guardado.err { color:var(--hot); background:color-mix(in srgb, var(--hot) 12%, transparent); }
    .cn-nota { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius-sm);
               padding:11px 14px; font-size:12.5px; color:var(--muted); line-height:1.55; margin-bottom:14px; }
    .cn-nota b { color:var(--text); }
    .cn-tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .cn-tools .input { min-width:220px; flex:1; max-width:380px; font-size:13.5px; }
    .cn-tools label { font-size:12.5px; color:var(--muted); display:inline-flex; gap:6px; align-items:center; cursor:pointer; }
    .cn-bloque { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:14px; overflow-x:auto; }
    .cn-bloque > header { display:flex; align-items:baseline; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .cn-bloque h3 { font-size:14.5px; font-weight:700; }
    .cn-bloque .meta { font-size:12px; color:var(--muted); }
    table.cn { width:100%; border-collapse:collapse; font-size:13px; }
    table.cn th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
    table.cn td { padding:7px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
    table.cn tr:last-child td { border-bottom:none; }
    table.cn td.num, table.cn th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    table.cn .cod { font-family:var(--font-mono); font-size:11.5px; color:var(--muted); width:70px; }
    table.cn input.cant { width:100px; text-align:right; font-size:15px; font-weight:700; padding:6px 10px; font-variant-numeric:tabular-nums; }
    table.cn tr.contado td:first-child { box-shadow:inset 3px 0 0 var(--ok); }
    .dif { font-weight:700; }
    .dif.mas { color:var(--ok); } .dif.menos { color:var(--hot); } .dif.igual { color:var(--muted); font-weight:500; }
    .oculto { display:none; }
    .cn-kpi.clic { cursor:pointer; transition:border-color .15s, transform .15s; }
    .cn-kpi.clic:hover { border-color:var(--accent); transform:translateY(-1px); }
    .cn-tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px; }
    .cn-tab { background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--muted); font-family:inherit; }
    .cn-tab:hover { color:var(--text); }
    .cn-tab[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }
    .cn-tab .n { font-size:11px; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:1px 7px; margin-left:5px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .cn-tab[aria-selected="true"] .n { background:var(--accent-tint); border-color:transparent; color:var(--accent); }
    .cn-filtros { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .chip-f { font:inherit; font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; }
    .chip-f.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent, #fff); }
    .cn-acc .fin { border-color:var(--ok); color:var(--ok); }
    .cn-cons { display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--ok); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; }
    .cn-cons .der { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
    .cn-cod { font-family:var(--font-mono); font-size:18px; font-weight:800; letter-spacing:.02em; }
    .cn-cons-txt { font-size:12.5px; color:var(--muted); margin-top:3px; }
    .cn-cons-txt b { color:var(--text); }
    td.movs { min-width:240px; }
    .mov { display:flex; gap:6px; align-items:center; font-size:12px; padding:2px 0; cursor:pointer; opacity:.6; }
    .mov.in { opacity:1; }
    .mov .neg { color:var(--hot); } .mov .pos { color:var(--ok); }
    .est { font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--bg); color:var(--muted); }
    .est.abierto { color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent); }
    .est.cerrado { color:var(--ok); background:color-mix(in srgb, var(--ok) 13%, transparent); }
    .est.aplicado { color:#2563a8; background:rgba(37,99,168,.12); }
    table.cn tr.actual td { background:var(--accent-tint); }
    .acc button { font:inherit; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:99px; cursor:pointer; background:var(--surface); border:1px solid var(--border); color:var(--muted); }
    .acc button:hover { border-color:var(--muted); color:var(--text); }
    .cn-sum { padding:12px 16px; cursor:pointer; font-size:13px; color:var(--muted); font-weight:600; }
    .cn-vacio { padding:28px 16px; text-align:center; color:var(--muted); font-size:13.5px; }
    .cn-msg { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--surface); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; z-index:50; display:none; }
    .cn-msg.err { background:var(--hot); color:#fff; }
    @media (max-width: 640px) { table.cn .cod { display:none; } table.cn input { width:76px; } }
  </style>
</head>
<body data-page="conteo" data-title="Conteo de inventario" data-subtitle="Producto terminado y graneles · contar, cargar y ver diferencias contra Odoo">
<div id="app-shell"></div>
<main id="app-content">
  <div id="cuerpo"><div class="cn-vacio">Cargando…</div></div>
  <div class="cn-msg" id="msg"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/supabase.js?v=202610061655"></script>
<script src="../shell/shell.js"></script>
<script src="conteo.js?v=202610061719"></script>
</body>
</html>
